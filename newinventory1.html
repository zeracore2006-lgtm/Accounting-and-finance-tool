      { id: 'TXN-882', date: '2026-07-24', description: 'Wire Transfer - Ocean Freight Carrier', amount: -6500.00, type: 'Debit', status: 'Pending Match', accountId: '1010' },
      { id: 'TXN-883', date: '2026-07-22', description: 'Petty Cash Replenishment Vault Transfer', amount: -500.00, type: 'Debit', status: 'Reconciled', accountId: '1020' }
    ];

    const INITIAL_TAX_RATES = [
      { id: 'TAX-01', name: 'Standard GST / VAT Rate', rate: 18.0, type: 'Output Tax', description: 'Standard rate applied to B2B equipment sales' },
      { id: 'TAX-02', name: 'Import Duty Tax', rate: 7.5, type: 'Input Tax', description: 'Customs duty on raw material ocean containers' },
      { id: 'TAX-03', name: 'State Commercial Sales Tax', rate: 6.0, type: 'Output Tax', description: 'Local municipal sales tax' }
    ];

    // --- MAIN APPLICATION COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [reportSubTab, setReportSubTab] = useState('trial_balance');

      // Theme State (Dark / Light)
      const [theme, setTheme] = useState(() => localStorage.getItem('zenora_theme') || 'dark');

      useEffect(() => {
        localStorage.setItem('zenora_theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        if (window.lucide) lucide.createIcons();
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      // State
      const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('nexus_settings')) || DEFAULT_SETTINGS);
      const [accounts, setAccounts] = useState(() => JSON.parse(localStorage.getItem('nexus_accounts')) || INITIAL_ACCOUNTS);
      const [journals, setJournals] = useState(() => JSON.parse(localStorage.getItem('nexus_journals')) || INITIAL_JOURNALS);
      const [customers, setCustomers] = useState(() => JSON.parse(localStorage.getItem('nexus_customers')) || INITIAL_CUSTOMERS);
      const [invoices, setInvoices] = useState(() => JSON.parse(localStorage.getItem('nexus_invoices')) || INITIAL_INVOICES);
      const [suppliers, setSuppliers] = useState(() => JSON.parse(localStorage.getItem('nexus_suppliers')) || INITIAL_SUPPLIERS);
      const [bills, setBills] = useState(() => JSON.parse(localStorage.getItem('nexus_bills')) || INITIAL_BILLS);
      const [bankTxns, setBankTxns] = useState(() => JSON.parse(localStorage.getItem('nexus_bank_txns')) || INITIAL_BANK_TRANSACTIONS);
      const [taxRates, setTaxRates] = useState(() => JSON.parse(localStorage.getItem('nexus_tax_rates')) || INITIAL_TAX_RATES);

      // Ledger search & filters
      const [selectedLedgerAccount, setSelectedLedgerAccount] = useState('1010');
      const [ledgerSearch, setLedgerSearch] = useState('');

      // Integration flow logs
      const [integrationLogs, setIntegrationLogs] = useState([]);

      // UI state
      const [modalState, setModalState] = useState({ open: false, type: null, payload: null });
      const [toast, setToast] = useState(null);

      // Save side-effects
      useEffect(() => localStorage.setItem('nexus_settings', JSON.stringify(settings)), [settings]);
      useEffect(() => localStorage.setItem('nexus_accounts', JSON.stringify(accounts)), [accounts]);
      useEffect(() => localStorage.setItem('nexus_journals', JSON.stringify(journals)), [journals]);
      useEffect(() => localStorage.setItem('nexus_customers', JSON.stringify(customers)), [customers]);
      useEffect(() => localStorage.setItem('nexus_invoices', JSON.stringify(invoices)), [invoices]);
      useEffect(() => localStorage.setItem('nexus_suppliers', JSON.stringify(suppliers)), [suppliers]);
      useEffect(() => localStorage.setItem('nexus_bills', JSON.stringify(bills)), [bills]);
      useEffect(() => localStorage.setItem('nexus_bank_txns', JSON.stringify(bankTxns)), [bankTxns]);
      useEffect(() => localStorage.setItem('nexus_tax_rates', JSON.stringify(taxRates)), [taxRates]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const triggerToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const fmtCurr = (amount) => {
        const num = Number(amount || 0);
        return `${settings.currencySymbol}${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      };

      // Real-time financial calculations
      const totals = useMemo(() => {
        const assets = accounts.filter(a => a.type === 'Asset').reduce((s, a) => s + Number(a.balance), 0);
        const liabilities = accounts.filter(a => a.type === 'Liability').reduce((s, a) => s + Number(a.balance), 0);
        const equity = accounts.filter(a => a.type === 'Equity').reduce((s, a) => s + Number(a.balance), 0);
        const revenue = accounts.filter(a => a.type === 'Revenue').reduce((s, a) => s + Number(a.balance), 0);
        const expenses = accounts.filter(a => a.type === 'Expense').reduce((s, a) => s + Number(a.balance), 0);
        const profit = revenue - expenses;

        const receivables = accounts.find(a => a.id === '1030')?.balance || 0;
        const payables = accounts.find(a => a.id === '2010')?.balance || 0;
        const bankBalance = (accounts.find(a => a.id === '1010')?.balance || 0) + (accounts.find(a => a.id === '1020')?.balance || 0);
        const cashFlow = bankBalance + receivables - payables;

        return { assets, liabilities, equity, revenue, expenses, profit, receivables, payables, bankBalance, cashFlow };
      }, [accounts]);

      // Double-Entry Journal Posting with Validation Engine
      const handlePostJournal = (newEntry) => {
        const totalDebits = newEntry.lines.reduce((s, l) => s + Number(l.debit || 0), 0);
        const totalCredits = newEntry.lines.reduce((s, l) => s + Number(l.credit || 0), 0);

        if (Math.abs(totalDebits - totalCredits) > 0.001) {
          alert(`ACCOUNTING ENGINE ERROR: Double-entry journal must be balanced!\nDebits (${fmtCurr(totalDebits)}) != Credits (${fmtCurr(totalCredits)})`);
          return false;
        }

        const entryId = newEntry.id || `JE-2026-00${journals.length + 1}`;
        const entry = {
          id: entryId,
          date: newEntry.date || new Date().toISOString().split('T')[0],
          reference: newEntry.reference,
          notes: newEntry.notes,
          status: 'Posted',
          lines: newEntry.lines
        };

        // Update Account Balances
        setAccounts(prevAccs => {
          return prevAccs.map(acc => {
            let bal = Number(acc.balance);
            newEntry.lines.forEach(line => {
              if (line.accountId === acc.id) {
                const dr = Number(line.debit || 0);
                const cr = Number(line.credit || 0);
                if (acc.type === 'Asset' || acc.type === 'Expense') {
                  bal += (dr - cr);
                } else {
                  bal += (cr - dr);
                }
              }
            });
            return { ...acc, balance: bal };
          });
        });

        setJournals(prev => [entry, ...prev]);
        setModalState({ open: false, type: null, payload: null });
        triggerToast(`Journal Entry ${entryId} posted successfully! Balance verified.`);
        return true;
      };

      // Reversal Engine
      const handleReverseJournal = (journalId) => {
        const targetJournal = journals.find(j => j.id === journalId);
        if (!targetJournal) return;

        const revId = `REV-${journalId}`;
        const reversalLines = targetJournal.lines.map(line => ({
          ...line,
          debit: line.credit,
          credit: line.debit
        }));

        handlePostJournal({
          id: revId,
          date: new Date().toISOString().split('T')[0],
          reference: `Reversal of ${journalId}`,
          notes: `Automatic accounting reversal counter-entry for ${journalId}`,
          lines: reversalLines
        });

        setJournals(prev => prev.map(j => j.id === journalId ? { ...j, status: 'Reversed' } : j));
        triggerToast(`Journal ${journalId} reversed with counter-entry ${revId}!`);
      };

      // Add New Account
      const handleAddAccount = (accData) => {
        if (accounts.some(a => a.code === accData.code)) {
          alert(`Account code ${accData.code} already exists! Use a unique number.`);
          return;
        }
        const newAcc = {
          id: accData.code,
          code: accData.code,
          name: accData.name,
          type: accData.type,
          category: accData.category || accData.type,
          balance: Number(accData.balance || 0),
          description: accData.description
        };
        setAccounts(prev => [...prev, newAcc]);
        setModalState({ open: false, type: null, payload: null });
        triggerToast(`Account ${newAcc.code} - ${newAcc.name} created!`);
      };

      // Integration Event Triggers
      const triggerIntegrationEvent = (eventType) => {
        const today = new Date().toISOString().split('T')[0];
        let logMsg = '';

        if (eventType === 'INVOICE') {
          handlePostJournal({
            date: today,
            reference: 'SYSTEM-INT-INV-5001',
            notes: 'Receive B2B Invoice -> Debited AR (1030), Credited Wholesale Revenue (4010)',
            lines: [
              { accountId: '1030', accountCode: '1030', accountName: 'Accounts Receivable (AR)', debit: 15000.00, credit: 0 },
              { accountId: '4010', accountCode: '4010', accountName: 'Direct B2B Wholesale Sales', debit: 0, credit: 15000.00 }
            ]
          });
          logMsg = '✓ Received Customer Invoice $15,000 → AR Credited & Wholesale Sales Recognized.';
        } else if (eventType === 'INVOICE_PAYMENT') {
          handlePostJournal({
            date: today,
            reference: 'SYSTEM-INT-PAY-5002',
            notes: 'Receive Invoice Payment -> Debited Bank (1010), Credited AR (1030)',
            lines: [
              { accountId: '1010', accountCode: '1010', accountName: 'Primary Operating Bank Account', debit: 15000.00, credit: 0 },
              { accountId: '1030', accountCode: '1030', accountName: 'Accounts Receivable (AR)', debit: 0, credit: 15000.00 }
            ]
          });
          logMsg = '✓ Received Invoice Payment $15,000 → Bank Debited & AR Cleared.';
        } else if (eventType === 'POS') {
          handlePostJournal({
            date: today,
            reference: 'SYSTEM-INT-POS-8001',
            notes: 'Receive POS Sale & Payment -> Debited Bank (1010), Credited Retail POS Revenue (4030) & Recognized COGS',
            lines: [
              { accountId: '1010', accountCode: '1010', accountName: 'Primary Operating Bank Account', debit: 4500.00, credit: 0 },
              { accountId: '4030', accountCode: '4030', accountName: 'Retail POS Sales', debit: 0, credit: 4500.00 },
              { accountId: '5010', accountCode: '5010', accountName: 'Cost of Goods Sold (COGS)', debit: 2700.00, credit: 0 },
              { accountId: '1050', accountCode: '1050', accountName: 'Finished Goods Inventory', debit: 0, credit: 2700.00 }
            ]
          });
          logMsg = '✓ Received POS Sale & Immediate Card Payment $4,500 (COGS $2,700 recognized).';
        } else if (eventType === 'INVENTORY_PURCHASE') {
          handlePostJournal({
            date: today,
            reference: 'SYSTEM-INT-PO-9001',
            notes: 'Receive Raw Materials Stock Purchase -> Debited Inventory (1040), Credited AP (2010)',
            lines: [
              { accountId: '1040', accountCode: '1040', accountName: 'Raw Materials Inventory', debit: 8200.00, credit: 0 },
              { accountId: '2010', accountCode: '2010', accountName: 'Accounts Payable (AP)', debit: 0, credit: 8200.00 }
            ]
          });
          logMsg = '✓ Received Inventory Purchase Order $8,200 → Inventory Stock Increased & AP Created.';
        } else if (eventType === 'PAYROLL') {
          handlePostJournal({
            date: today,
            reference: 'SYSTEM-INT-PAYROLL-01',
            notes: 'HR Payroll Run -> Debited Payroll Expense (5040), Credited Tax Payable (2030) & Net Bank Pay (1010)',
            lines: [
              { accountId: '5040', accountCode: '5040', accountName: 'HR Payroll & Salaries Expense', debit: 12000.00, credit: 0 },
              { accountId: '2030', accountCode: '2030', accountName: 'Sales & GST Tax Payable', debit: 0, credit: 2100.00 },
              { accountId: '1010', accountCode: '1010', accountName: 'Primary Operating Bank Account', debit: 0, credit: 9900.00 }
            ]
          });
          logMsg = '✓ HR Payroll Processed Gross $12,000 → Tax Withheld $2,100, Net $9,900 Disbursed from Bank.';
        }

        setIntegrationLogs(prev => [`[${new Date().toLocaleTimeString()}] ${logMsg}`, ...prev]);
      };

      const runFullIntegrationSuite = () => {
        triggerIntegrationEvent('INVOICE');
        setTimeout(() => triggerIntegrationEvent('INVOICE_PAYMENT'), 300);
        setTimeout(() => triggerIntegrationEvent('POS'), 600);
        setTimeout(() => triggerIntegrationEvent('INVENTORY_PURCHASE'), 900);
        setTimeout(() => triggerIntegrationEvent('PAYROLL'), 1200);
        triggerToast('Full Financial & Supply Chain Flow Test Executed!');
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          {/* TOAST ALERTS */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center space-x-3 bg-emerald-600 text-white px-5 py-3 rounded-2xl shadow-2xl animate-bounce border border-emerald-400/40">
              <i data-lucide="check-circle-2" className="w-5 h-5"></i>
              <span className="font-semibold text-xs">{toast}</span>
            </div>
          )}

          {/* MAIN SIDEBAR NAVIGATION */}
          <aside className="w-full md:w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 sticky top-0 md:h-screen z-30 overflow-y-auto no-print">
            <div>
              {/* ERP Brand Header */}
              <div className="flex items-center justify-between space-x-3 px-3 py-3 mb-4 bg-slate-950/60 rounded-2xl border border-slate-800">
                <div className="flex items-center space-x-3 overflow-hidden">

import { Injectable, BadRequestException } from '@nestjs/common';
import { InjectRepository } from '@nestjs/typeorm';
import { DataSource, Repository } from 'typeorm';
import { JournalEntry } from './entities/journal-entry.entity';
import { Account } from './entities/account.entity';
import { CreateJournalDto } from './dto/create-journal.dto';

@Injectable()
export class AccountingService {
  constructor(
    @InjectRepository(JournalEntry) private journalRepo: Repository<JournalEntry>,
    @InjectRepository(Account) private accountRepo: Repository<Account>,
    private dataSource: DataSource,
  ) {}

  /**
   * Posts double-entry journal with debit/credit balance validation inside SQL transaction
   */
  async postJournalEntry(dto: CreateJournalDto): Promise<JournalEntry> {
    const totalDebits = dto.lines.reduce((sum, line) => sum + (line.debit || 0), 0);
    const totalCredits = dto.lines.reduce((sum, line) => sum + (line.credit || 0), 0);

    // Double-Entry Rule Validation
    if (Math.abs(totalDebits - totalCredits) > 0.001) {
      throw new BadRequestException(\`Unbalanced Journal Entry: Debits (\${totalDebits}) != Credits (\${totalCredits})\`);
    }

    const queryRunner = this.dataSource.createQueryRunner();
    await queryRunner.connect();
    await queryRunner.startTransaction();

    try {
      const journal = this.journalRepo.create({
        entryNumber: \`JE-\${Date.now()}\`,
        entryDate: dto.date,
        reference: dto.reference,
        notes: dto.notes,
        lines: dto.lines,
      });

      const savedJournal = await queryRunner.manager.save(journal);

      // Update Chart of Account balances
      for (const line of dto.lines) {
        const account = await queryRunner.manager.findOne(Account, { where: { id: line.accountId } });
        if (!account) throw new BadRequestException(\`Account \${line.accountId} not found\`);

        const isDebitNormal = account.type === 'Asset' || account.type === 'Expense';
        const netChange = isDebitNormal ? (line.debit - line.credit) : (line.credit - line.debit);
        
        account.balance = Number(account.balance) + netChange;
        await queryRunner.manager.save(account);
      }

      await queryRunner.commitTransaction();
      return savedJournal;
    } catch (err) {
      await queryRunner.rollbackTransaction();
      throw err;
    } finally {
      await queryRunner.release();
    }
  }
}`}</pre>

CREATE TABLE chart_of_accounts (
  id VARCHAR(36) PRIMARY KEY,
  code VARCHAR(20) UNIQUE NOT NULL,
  name VARCHAR(150) NOT NULL,
  type VARCHAR(50) NOT NULL CHECK (type IN ('Asset', 'Liability', 'Equity', 'Revenue', 'Expense')),
  category VARCHAR(100) NOT NULL,
  balance NUMERIC(15, 2) DEFAULT 0.00,
  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE journal_entries (
  id VARCHAR(36) PRIMARY KEY,
  entry_number VARCHAR(50) UNIQUE NOT NULL,
  entry_date DATE NOT NULL,
  reference VARCHAR(150),
  notes TEXT,
  status VARCHAR(20) DEFAULT 'Posted' CHECK (status IN ('Posted', 'Reversed', 'Draft')),
  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE journal_lines (
  id VARCHAR(36) PRIMARY KEY,
  journal_id VARCHAR(36) REFERENCES journal_entries(id) ON DELETE CASCADE,
  account_id VARCHAR(36) REFERENCES chart_of_accounts(id),
  debit NUMERIC(15, 2) DEFAULT 0.00,
  credit NUMERIC(15, 2) DEFAULT 0.00
);

CREATE TABLE bank_transactions (
  id VARCHAR(36) PRIMARY KEY,
  account_id VARCHAR(36) REFERENCES chart_of_accounts(id),
  txn_date DATE NOT NULL,
  description VARCHAR(255) NOT NULL,
  amount NUMERIC(15, 2) NOT NULL,
  status VARCHAR(30) DEFAULT 'Pending Match' CHECK (status IN ('Pending Match', 'Reconciled', 'Unmatched'))
);`}</pre>

                    <label className="block text-slate-300 font-semibold mb-1">Expense Category</label>
                    <input type="text" name="category" defaultValue="Raw Materials Inventory" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div className="flex justify-end space-x-3 pt-3">
                    <button type="button" onClick={() => setModalState({ open: false, type: null, payload: null })} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold shadow-lg">Record Bill</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
