    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [theme, setTheme] = useState(() => localStorage.getItem('zenora_theme') || 'dark');

      useEffect(() => {
        localStorage.setItem('zenora_theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        if (window.lucide) window.lucide.createIcons();
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      const [accounts, setAccounts] = useState(INITIAL_ACCOUNTS);
      const [journalEntries, setJournalEntries] = useState(INITIAL_JOURNAL_ENTRIES);
      const [bankTxns, setBankTxns] = useState(INITIAL_BANK_TRANSACTIONS);
      const [auditTrail, setAuditTrail] = useState([
        { id: 1, time: '2026-07-01 09:00', action: 'System Initialized', user: 'Admin', details: 'Chart of Accounts created with opening balances.' },
        { id: 2, time: '2026-07-15 14:30', action: 'Journal Posted', user: 'Sales Module', details: 'Posted voucher INV-2026-0012 ($16,800.00)' },
        { id: 3, time: '2026-07-18 11:15', action: 'Journal Posted', user: 'Procurement Module', details: 'Posted voucher PUR-2026-0089 ($12,000.00)' },
        { id: 4, time: '2026-07-22 18:00', action: 'POS Integrated', user: 'POS Terminal #1', details: 'Posted voucher POS-2026-0442 ($5,600.00)' },
      ]);

      // General Ledger Filters
      const [glAccountFilter, setGlAccountFilter] = useState('ALL');
      const [glDateFrom, setGlDateFrom] = useState('');
      const [glDateTo, setGlDateTo] = useState('');
      const [glTypeFilter, setGlTypeFilter] = useState('ALL'); // ALL, DEBIT, CREDIT
      const [glSearchQuery, setGlSearchQuery] = useState('');

      // New Journal Modal
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [newVoucher, setNewVoucher] = useState({
        description: '',
        date: new Date().toISOString().split('T')[0],
        lines: [
          { accountId: '1010', debit: 0, credit: 0, memo: '' },
          { accountId: '4010', debit: 0, credit: 0, memo: '' }
        ]
      });

      // Flow Tester State
      const [testLog, setTestLog] = useState([]);
      const [isTestRunning, setIsTestRunning] = useState(false);

      // Re-initialize Lucide Icons on mount & updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, journalEntries, accounts, isModalOpen, testLog]);

      // --- ACCOUNTING ENGINE CALCULATIONS ---
      const computedAccounts = useMemo(() => {
        return accounts.map(acc => {
          let totalDebit = 0;
          let totalCredit = 0;

          journalEntries.forEach(entry => {
            if (entry.status === 'POSTED') {
              entry.lines.forEach(line => {
                if (line.accountId === acc.id) {
                  totalDebit += Number(line.debit || 0);
                  totalCredit += Number(line.credit || 0);
                }
              });
            }
          });

          let current = acc.openingBalance;
          if (acc.category === 'ASSET' || acc.category === 'EXPENSE') {
            current += (totalDebit - totalCredit);
          } else {
            current += (totalCredit - totalDebit);
          }

          return { ...acc, currentBalance: current, totalDebit, totalCredit };
        });
      }, [accounts, journalEntries]);

      // --- GENERAL LEDGER LINES COMPUTATION ---
      const ledgerLines = useMemo(() => {
        let lines = [];
        journalEntries.forEach(entry => {
          if (entry.status !== 'POSTED') return;
          entry.lines.forEach((line, idx) => {
            const acc = computedAccounts.find(a => a.id === line.accountId);
            lines.push({
              jeId: entry.id,
              voucherNo: entry.voucherNo,
              date: entry.date,
              description: entry.description,
              accountId: line.accountId,
              accountName: acc ? acc.name : 'Unknown Account',
              accountCategory: acc ? acc.category : '',
              debit: line.debit,
              credit: line.credit,
              memo: line.memo || entry.description,
              postedBy: entry.postedBy
            });
          });
        });

        // Apply Filters
        if (glAccountFilter !== 'ALL') {
          lines = lines.filter(l => l.accountId === glAccountFilter);
        }
        if (glDateFrom) {
          lines = lines.filter(l => l.date >= glDateFrom);
        }
        if (glDateTo) {
          lines = lines.filter(l => l.date <= glDateTo);
        }
        if (glTypeFilter === 'DEBIT') {
          lines = lines.filter(l => l.debit > 0);
        } else if (glTypeFilter === 'CREDIT') {
          lines = lines.filter(l => l.credit > 0);
        }
        if (glSearchQuery) {
          const q = glSearchQuery.toLowerCase();
          lines = lines.filter(l => 
            l.voucherNo.toLowerCase().includes(q) || 
            l.description.toLowerCase().includes(q) ||
            l.accountName.toLowerCase().includes(q) ||
            l.memo.toLowerCase().includes(q)
          );
        }

        // Calculate running balance
        let running = 0;
        return lines.sort((a, b) => new Date(a.date) - new Date(b.date)).map(l => {
          if (l.accountCategory === 'ASSET' || l.accountCategory === 'EXPENSE') {
            running += (l.debit - l.credit);
          } else {
            running += (l.credit - l.debit);
          }
          return { ...l, runningBalance: running };
        });
      }, [journalEntries, computedAccounts, glAccountFilter, glDateFrom, glDateTo, glTypeFilter, glSearchQuery]);

      // --- FINANCIAL REPORTS ENGINE ---
      const financialMetrics = useMemo(() => {
        let totalAssets = 0;
        let totalLiabilities = 0;
        let totalEquity = 0;
        let totalRevenue = 0;
        let totalExpenses = 0;

        let totalDebitsTrial = 0;
        let totalCreditsTrial = 0;

        computedAccounts.forEach(acc => {
          totalDebitsTrial += acc.totalDebit;
          totalCreditsTrial += acc.totalCredit;

          if (acc.category === 'ASSET') totalAssets += acc.currentBalance;
          if (acc.category === 'LIABILITY') totalLiabilities += acc.currentBalance;
          if (acc.category === 'EQUITY') totalEquity += acc.currentBalance;
          if (acc.category === 'REVENUE') totalRevenue += acc.currentBalance;
          if (acc.category === 'EXPENSE') totalExpenses += acc.currentBalance;
        });

        const netProfit = totalRevenue - totalExpenses;
        const totalEquityWithNetProfit = totalEquity + netProfit;

        return {
          totalAssets,
          totalLiabilities,
          totalEquity,
          totalRevenue,
          totalExpenses,
          netProfit,
          totalEquityWithNetProfit,
          totalDebitsTrial,
          totalCreditsTrial,
          isBalanced: Math.abs(totalAssets - (totalLiabilities + totalEquityWithNetProfit)) < 0.01
        };
      }, [computedAccounts]);

      // --- JOURNAL ENTRY REVERSAL ---
      const handleReverseJournal = (jeId) => {
        const je = journalEntries.find(j => j.id === jeId);
        if (!je || je.status === 'REVERSED') return;

        const newVoucherNo = `REV-${je.voucherNo}`;
        const reversedLines = je.lines.map(l => ({
          accountId: l.accountId,
          debit: l.credit,
          credit: l.debit,
          memo: `Reversal of ${je.voucherNo}: ${l.memo || ''}`
        }));

        const newJe = {
          id: `JE-${Date.now()}`,
          voucherNo: newVoucherNo,
          date: new Date().toISOString().split('T')[0],
          description: `REVERSAL: ${je.description}`,
          status: 'POSTED',
          postedBy: 'Accounting Reversal Engine',
          createdAt: new Date().toISOString(),
          lines: reversedLines
        };

        setJournalEntries(prev => prev.map(j => j.id === jeId ? { ...j, status: 'REVERSED' } : j).concat(newJe));
        setAuditTrail(prev => [{
          id: Date.now(),
          time: new Date().toLocaleString(),
          action: 'Journal Reversal',
          user: 'Admin',
          details: `Reversed voucher ${je.voucherNo} with counter-voucher ${newVoucherNo}`
        }, ...prev]);
      };

      // --- POST NEW JOURNAL VOUCHER ---
      const handlePostJournal = (e) => {
        e.preventDefault();
        const totalDebits = newVoucher.lines.reduce((s, l) => s + Number(l.debit || 0), 0);
        const totalCredits = newVoucher.lines.reduce((s, l) => s + Number(l.credit || 0), 0);

        if (Math.abs(totalDebits - totalCredits) > 0.001) {
          alert(`Validation Error: Debits ($${totalDebits.toFixed(2)}) must equal Credits ($${totalCredits.toFixed(2)})!`);
          return;
        }

        if (totalDebits === 0) {
          alert('Validation Error: Journal entry total cannot be $0.00');
          return;
        }

        const vNo = `JV-2026-${String(journalEntries.length + 1).padStart(4, '0')}`;
        const newEntry = {
          id: `JE-${Date.now()}`,
          voucherNo: vNo,
          date: newVoucher.date,
          description: newVoucher.description,
          status: 'POSTED',
          postedBy: 'User Action',
          createdAt: new Date().toISOString(),
          lines: newVoucher.lines.map(l => ({
            accountId: l.accountId,
            debit: Number(l.debit || 0),
            credit: Number(l.credit || 0),
            memo: l.memo
          }))
        };

        setJournalEntries(prev => [...prev, newEntry]);
        setAuditTrail(prev => [{
          id: Date.now(),
          time: new Date().toLocaleString(),
          action: 'Voucher Posted',
          user: 'User',
          details: `Posted journal voucher ${vNo} ($${totalDebits.toFixed(2)})`
        }, ...prev]);

        setIsModalOpen(false);
        setNewVoucher({
          description: '',
          date: new Date().toISOString().split('T')[0],
          lines: [
            { accountId: '1010', debit: 0, credit: 0, memo: '' },
            { accountId: '4010', debit: 0, credit: 0, memo: '' }
          ]
        });
      };

      // --- INTEGRATION & END-TO-END FLOW TESTER ---
      const runEndToEndFinancialFlowTest = async () => {
        setIsTestRunning(true);
        setTestLog([]);
        const addLog = (step, title, details, voucher) => {
          setTestLog(prev => [...prev, { step, title, details, voucher, timestamp: new Date().toLocaleTimeString() }]);
        };

        addLog(1, 'Flow Test Started', 'Initializing automated end-to-end accounting integration pipeline...');
        await new Promise(r => setTimeout(r, 600));

        // Step 1: Sales Invoice Creation
        const invVoucher = `INV-TEST-${Date.now().toString().slice(-4)}`;
        addLog(2, 'Step 1: Receive Invoice → Accounting Transaction', `Generating B2B Invoice to Global Retail Ltd ($22,400.00 + $2,688.00 Tax)`, invVoucher);
        const je1 = {
          id: `JE-T1-${Date.now()}`,
          voucherNo: invVoucher,
          date: new Date().toISOString().split('T')[0],
          description: 'Automated Test: Customer Sales Invoice Generated',
          status: 'POSTED',
          postedBy: 'Invoice Integration Service',
          createdAt: new Date().toISOString(),
          lines: [
            { accountId: '1200', debit: 25088, credit: 0, memo: 'Accounts Receivable' },
            { accountId: '4010', debit: 0, credit: 22400, memo: 'Product Sales Revenue' },
            { accountId: '2100', debit: 0, credit: 2688, memo: 'Sales Tax Payable (12%)' }
          ]
        };
        setJournalEntries(prev => [...prev, je1]);
        await new Promise(r => setTimeout(r, 800));

        // Step 2: Invoice Payment Collection
        const payVoucher = `PAY-TEST-${Date.now().toString().slice(-4)}`;
        addLog(3, 'Step 2: Receive Invoice Payment → Accounting', `Collecting Customer Wire Deposit ($25,088.00) clearing AR`, payVoucher);
        const je2 = {
          id: `JE-T2-${Date.now()}`,
          voucherNo: payVoucher,
          date: new Date().toISOString().split('T')[0],
          description: 'Automated Test: Customer Wire Payment Received',
          status: 'POSTED',
          postedBy: 'Bank Integration Gateway',
          createdAt: new Date().toISOString(),
          lines: [
            { accountId: '1010', debit: 25088, credit: 0, memo: 'Bank Debit' },
            { accountId: '1200', debit: 0, credit: 25088, memo: 'AR Credit Clearance' }
          ]
        };
        setJournalEntries(prev => [...prev, je2]);
        await new Promise(r => setTimeout(r, 800));

        // Step 3: POS Retail Sale
        const posVoucher = `POS-TEST-${Date.now().toString().slice(-4)}`;
        addLog(4, 'Step 3: Receive POS Sale & Payment → Accounting', `Processing POS Cash Terminal Batch ($3,200 Revenue, $1,600 COGS)`, posVoucher);
        const je3 = {
          id: `JE-T3-${Date.now()}`,
          voucherNo: posVoucher,
          date: new Date().toISOString().split('T')[0],
          description: 'Automated Test: POS Counter Transaction Settlement',
          status: 'POSTED',
          postedBy: 'POS Terminal Service',
          createdAt: new Date().toISOString(),
          lines: [
            { accountId: '1020', debit: 3584, credit: 0, memo: 'Petty Cash/Register' },
            { accountId: '4020', debit: 0, credit: 3200, memo: 'POS Sales Revenue' },
            { accountId: '2100', debit: 0, credit: 384, memo: 'Sales Tax Collected' },
            { accountId: '5010', debit: 1600, credit: 0, memo: 'Cost of Goods Sold' },
            { accountId: '1310', debit: 0, credit: 1600, memo: 'Finished Goods Reduction' }
          ]
        };
        setJournalEntries(prev => [...prev, je3]);
        await new Promise(r => setTimeout(r, 800));

        // Step 4: Inventory Purchase Intake
        const poVoucher = `PO-TEST-${Date.now().toString().slice(-4)}`;
        addLog(5, 'Step 4: Receive Inventory Purchase → Accounting', `Procuring Warehouse Stock ($14,500 Raw Materials Inventory)`, poVoucher);
        const je4 = {
          id: `JE-T4-${Date.now()}`,
          voucherNo: poVoucher,
          date: new Date().toISOString().split('T')[0],
          description: 'Automated Test: Vendor Purchase Order Receipt',
          status: 'POSTED',
          postedBy: 'Supply Chain Procurement',
          createdAt: new Date().toISOString(),
          lines: [
            { accountId: '1300', debit: 14500, credit: 0, memo: 'Raw Materials Asset' },
            { accountId: '2010', debit: 0, credit: 14500, memo: 'Accounts Payable Liability' }
          ]
        };
        setJournalEntries(prev => [...prev, je4]);
        await new Promise(r => setTimeout(r, 800));

        // Step 5: HR Payroll Integration
        const payrVoucher = `PAYROLL-TEST-${Date.now().toString().slice(-4)}`;
        addLog(6, 'Step 5: HR → Payroll → Accounting Architecture', `Executing Monthly Payroll ($18,000 Gross Salaries, $3,600 Tax Withheld)`, payrVoucher);
        const je5 = {
          id: `JE-T5-${Date.now()}`,
          voucherNo: payrVoucher,
          date: new Date().toISOString().split('T')[0],
          description: 'Automated Test: HR Monthly Payroll Accrual',
          status: 'POSTED',
          postedBy: 'HR Payroll Engine',
          createdAt: new Date().toISOString(),
          lines: [
            { accountId: '5020', debit: 18000, credit: 0, memo: 'Gross Salaries Expense' },
            { accountId: '2110', debit: 0, credit: 3600, memo: 'Payroll Taxes Withheld' },
            { accountId: '1010', debit: 0, credit: 14400, memo: 'Net Direct Deposit Payroll' }

                            <span>{a.code} - {a.name}</span>
                            <span className="font-mono text-rose-400">${a.currentBalance.toFixed(2)}</span>
                          </div>
                        ))}
                        <div className="flex justify-between font-bold text-rose-400 py-1 border-t border-slate-700">
                          <span>Total Liabilities</span>
                          <span className="font-mono">${financialMetrics.totalLiabilities.toFixed(2)}</span>
                        </div>

                        <p className="font-bold text-slate-300 uppercase tracking-wider pt-3">Equity</p>
                        {computedAccounts.filter(a => a.category === 'EQUITY').map(a => (
                          <div key={a.id} className="flex justify-between py-1 border-b border-slate-800/40 text-slate-300">
                            <span>{a.code} - {a.name}</span>
                            <span className="font-mono text-indigo-400">${a.currentBalance.toFixed(2)}</span>
                          </div>
                        ))}
                        <div className="flex justify-between py-1 border-b border-slate-800/40 text-slate-300">
                          <span>Current Net Earnings</span>
                          <span className="font-mono text-indigo-400">${financialMetrics.netProfit.toFixed(2)}</span>
                        </div>
                        <div className="flex justify-between font-bold text-indigo-400 py-1 border-t border-slate-700">
                          <span>Total Liabilities & Equity</span>
                          <span className="font-mono">${(financialMetrics.totalLiabilities + financialMetrics.totalEquityWithNetProfit).toFixed(2)}</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* TRIAL BALANCE REPORT TABLE */}
                  <div className="bg-surface-900 border border-slate-800 p-5 rounded-xl space-y-4">
                    <h3 className="font-bold text-white text-base">Unadjusted Trial Balance Report</h3>
                    <table className="w-full text-left text-xs">
                      <thead className="bg-surface-950 text-slate-400 uppercase font-semibold">
                        <tr>
                          <th className="p-3">Account Code</th>
                          <th className="p-3">Account Description</th>
                          <th className="p-3 text-right">Debit Balance ($)</th>
                          <th className="p-3 text-right">Credit Balance ($)</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {computedAccounts.map(a => {
                          const isDebitAccount = a.category === 'ASSET' || a.category === 'EXPENSE';
                          return (
                            <tr key={a.id} className="hover:bg-slate-800/30">
                              <td className="p-3 font-mono text-slate-400">{a.code}</td>
                              <td className="p-3 font-medium text-slate-200">{a.name}</td>
                              <td className="p-3 text-right font-mono text-emerald-400">
                                {isDebitAccount ? `$${a.currentBalance.toFixed(2)}` : '-'}
                              </td>
                              <td className="p-3 text-right font-mono text-indigo-400">
                                {!isDebitAccount ? `$${a.currentBalance.toFixed(2)}` : '-'}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* 5. BANKING & CASH MANAGEMENT */}
              {activeTab === 'banking' && (
                <div className="space-y-6">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    {computedAccounts.filter(a => a.subType === 'BANK' || a.subType === 'CASH').map(b => (
                      <div key={b.id} className="bg-surface-900 border border-slate-800 p-5 rounded-xl flex justify-between items-center">
                        <div>
                          <span className="text-xs font-semibold text-slate-400 uppercase">{b.subType} ACCOUNT</span>
                          <h3 className="text-lg font-bold text-white mt-1">{b.name}</h3>
                          <p className="text-xs text-slate-500">Account Code: {b.code}</p>
                        </div>
                        <div className="text-right">
                          <p className="text-2xl font-bold text-emerald-400 font-mono">${b.currentBalance.toFixed(2)}</p>
                          <span className="text-xs text-emerald-500 bg-emerald-500/10 px-2 py-0.5 rounded font-medium">Reconciled</span>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="bg-surface-900 border border-slate-800 p-5 rounded-xl space-y-4">
                    <h3 className="font-bold text-white text-base">Bank Statement Reconciliation Queue</h3>
                    <table className="w-full text-left text-xs">
                      <thead className="bg-surface-950 text-slate-400 uppercase font-semibold">
                        <tr>
                          <th className="p-3">Date</th>
                          <th className="p-3">Bank Reference</th>
                          <th className="p-3">Type</th>
                          <th className="p-3 text-right">Amount ($)</th>
                          <th className="p-3 text-center">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {bankTxns.map(bt => (
                          <tr key={bt.id} className="hover:bg-slate-800/30">
                            <td className="p-3 font-mono text-slate-400">{bt.date}</td>
                            <td className="p-3 font-medium text-slate-200">{bt.reference}</td>
                            <td className="p-3 text-slate-400">{bt.type}</td>
                            <td className={`p-3 text-right font-mono font-bold ${bt.amount >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                              ${bt.amount.toFixed(2)}
                            </td>
                            <td className="p-3 text-center">
                              <span className={`px-2.5 py-0.5 rounded-full font-bold ${
                                bt.status === 'RECONCILED' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'
                              }`}>
                                {bt.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* 6. TAX & COMPLIANCE */}
              {activeTab === 'tax' && (
                <div className="space-y-6">
                  <div className="bg-surface-900 border border-slate-800 p-5 rounded-xl space-y-4">
                    <h3 className="font-bold text-white text-base">Tax Account Liabilities Summary</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {computedAccounts.filter(a => a.subType === 'TAX' || a.subType === 'PAYROLL').map(t => (
                        <div key={t.id} className="bg-slate-800/40 p-4 rounded-lg border border-slate-700/50">
                          <p className="text-xs text-slate-400">{t.name}</p>
                          <p className="text-xl font-bold text-rose-400 font-mono mt-1">${t.currentBalance.toFixed(2)}</p>
                          <p className="text-[10px] text-slate-500 mt-1">Payable to Tax Authority</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* 7. SUBSYSTEM INTEGRATIONS */}
              {activeTab === 'integrations' && (
                <div className="space-y-6">
                  <div className="bg-surface-900 border border-slate-800 p-5 rounded-xl space-y-4">
                    <div className="flex justify-between items-center">
                      <div>
                        <h3 className="font-bold text-white text-base">End-to-End Financial Flow Tester</h3>
                        <p className="text-xs text-slate-400">Simulates real-world sub-system events (Invoice $\rightarrow$ Payment $\rightarrow$ POS Sale $\rightarrow$ Inventory Purchase $\rightarrow$ HR Payroll).</p>
                      </div>
                      <button
                        onClick={runEndToEndFinancialFlowTest}
                        disabled={isTestRunning}
                        className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-semibold text-sm transition"
                      >
                        {isTestRunning ? 'Running Integration Test...' : 'Run Integration Test'}
                      </button>
                    </div>

                    <div className="bg-surface-950 p-4 rounded-xl border border-slate-800 font-mono text-xs space-y-3 min-h-[240px]">
                      {testLog.length === 0 ? (
                        <p className="text-slate-500 italic">Click "Run Integration Test" to trigger automated subsystem financial events.</p>
                      ) : (
                        testLog.map((log, i) => (
                          <div key={i} className="flex gap-3 items-start border-b border-slate-800/50 pb-2">
                            <span className="text-slate-500">[{log.timestamp}]</span>
                            <div className="flex-1">
                              <span className="text-indigo-400 font-bold">{log.title}: </span>
                              <span className="text-slate-300">{log.details}</span>
                              {log.voucher && (
                                <span className="ml-2 bg-slate-800 text-emerald-400 px-2 py-0.5 rounded border border-slate-700">
                                  Voucher: {log.voucher}
                                </span>
                              )}
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* 8. AUDIT TRAIL */}
              {activeTab === 'audit' && (
                <div className="space-y-6">
                  <div className="bg-surface-900 border border-slate-800 p-5 rounded-xl space-y-4">
                    <h3 className="font-bold text-white text-base">Transaction Audit Log</h3>
                    <div className="space-y-3 text-xs">
                      {auditTrail.map(a => (
                        <div key={a.id} className="p-3 bg-slate-800/30 rounded-lg border border-slate-800 flex justify-between items-center">
                          <div>
                            <span className="font-bold text-indigo-400 mr-2">[{a.action}]</span>
                            <span className="text-slate-200">{a.details}</span>
                          </div>
                          <div className="text-right text-slate-500">
                            <p>{a.user}</p>
                            <p className="text-[10px]">{a.time}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* NEW JOURNAL ENTRY MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-surface-900 border border-slate-800 rounded-xl w-full max-w-2xl overflow-hidden shadow-2xl space-y-4 p-6">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-base">Create New Journal Voucher</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handlePostJournal} className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-slate-400 mb-1">Transaction Description</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. Monthly Rent Expense Deposit" 
                        value={newVoucher.description} 
                        onChange={e => setNewVoucher({...newVoucher, description: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Transaction Date</label>
                      <input 
                        type="date" 
                        required 
                        value={newVoucher.date} 
                        onChange={e => setNewVoucher({...newVoucher, date: e.target.value})}
                        className="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-white"
                      />
                    </div>
                  </div>

                  <div className="space-y-2">
                    <div className="flex justify-between items-center">
                      <label className="block text-slate-300 font-bold">Journal Lines (Debits must equal Credits)</label>
                      <button 
                        type="button" 
                        onClick={() => setNewVoucher({
                          ...newVoucher, 
                          lines: [...newVoucher.lines, { accountId: '1010', debit: 0, credit: 0, memo: '' }]
                        })}
                        className="text-indigo-400 hover:underline text-xs"
                      >
                        + Add Line
                      </button>
                    </div>

                    {newVoucher.lines.map((l, idx) => (
                      <div key={idx} className="grid grid-cols-12 gap-2 items-center">
                        <select 
                          value={l.accountId} 
                          onChange={e => {
                            const updated = [...newVoucher.lines];
                            updated[idx].accountId = e.target.value;
                            setNewVoucher({...newVoucher, lines: updated});
                          }}
                          className="col-span-5 bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-white"
                        >
                          {computedAccounts.map(a => (
                            <option key={a.id} value={a.id}>{a.code} - {a.name}</option>
                          ))}
                        </select>

                        <input 
                          type="number" 
                          placeholder="Debit $" 
                          value={l.debit || ''} 
                          onChange={e => {
                            const updated = [...newVoucher.lines];
                            updated[idx].debit = e.target.value;
                            setNewVoucher({...newVoucher, lines: updated});
                          }}
                          className="col-span-3 bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-emerald-400 font-mono"
                        />

                        <input 
                          type="number" 
                          placeholder="Credit $" 
                          value={l.credit || ''} 
                          onChange={e => {
                            const updated = [...newVoucher.lines];
                            updated[idx].credit = e.target.value;
                            setNewVoucher({...newVoucher, lines: updated});
                          }}
                          className="col-span-3 bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-indigo-400 font-mono"
                        />

                        <button 
                          type="button" 
                          onClick={() => {
                            const updated = newVoucher.lines.filter((_, i) => i !== idx);
                            setNewVoucher({...newVoucher, lines: updated});
                          }}
                          className="col-span-1 text-rose-400 text-center hover:text-rose-300"
                        >
                          ✕
                        </button>
                      </div>
                    ))}
                  </div>

                  <div className="flex justify-end gap-3 pt-3 border-t border-slate-800">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)} 
                      className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs font-semibold"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded text-xs font-semibold"
                    >
                      Post Voucher
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
