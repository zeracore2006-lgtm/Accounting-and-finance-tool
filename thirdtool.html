  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- INITIAL FINANCIAL SEED DATA ---

    const INITIAL_INVENTORY_ITEMS = [

    const INITIAL_JOURNALS = [
      {
        id: 'JV-2026-0001',
        date: '2026-07-01',
        reference: 'GRN-9982 - Raw Material Purchase',
        narration: 'Purchased 100 units of Micro-Controllers from TechCorp',

        ]
      },
      {
        id: 'JV-2026-0002',
        date: '2026-07-12',
        reference: 'INV-4091 - Customer Sales Order',
        narration: 'Sold 50 units of Stepper Motors to Automation Ltd',
        status: 'Posted',
        approvalStatus: 'Approved',
        approvedBy: 'Chief Accountant',
        createdBy: 'Sales Specialist',
        lines: [
          { accountCode: '1020', accountName: 'Accounts Receivable (AR)', debit: 7250.00, credit: 0.00 },
          { accountCode: '4010', accountName: 'Wholesale Hardware Sales Revenue', debit: 0.00, credit: 7250.00 },
          { accountCode: '5010', accountName: 'Cost of Goods Sold (COGS)', debit: 4250.00, credit: 0.00 },
          { accountCode: '1040', accountName: 'Finished Goods Inventory', debit: 0.00, credit: 4250.00 }
        ]
      },
      {
        id: 'JV-2026-0003',
        date: '2026-07-20',
        reference: 'PAY-0089 - Warehouse Rent Payment',
        narration: 'Monthly facility lease payment for Logistics Hub A',
        status: 'Posted',
        approvalStatus: 'Approved',
        approvedBy: 'Finance Director',
        createdBy: 'Accounts Assistant',
        lines: [
          { accountCode: '6020', accountName: 'Warehouse Rent & Utilities', debit: 4500.00, credit: 0.00 },
          { accountCode: '1010', accountName: 'Cash & Bank Balances', debit: 0.00, credit: 4500.00 }
        ]
      },
      {
        id: 'JV-2026-0004',
        date: '2026-07-28',
        reference: 'GRN-1004 - Conveyor Belt Order',
        narration: 'Purchase 5 units of Conveyor Belts (Pending Approval)',
        status: 'Draft',
        approvalStatus: 'Pending Approval',
        approvedBy: '-',
        createdBy: 'Inventory Manager',
        lines: [
          { accountCode: '1030', accountName: 'Raw Material Inventory', debit: 3250.00, credit: 0.00 },
          { accountCode: '2010', accountName: 'Accounts Payable (AP)', debit: 0.00, credit: 3250.00 }
        ]
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [theme, setTheme] = useState(() => localStorage.getItem('zenora_theme') || 'dark');

      useEffect(() => {
        localStorage.setItem('zenora_theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

      const [accounts, setAccounts] = useState(INITIAL_ACCOUNTS);
      const [inventory, setInventory] = useState(INITIAL_INVENTORY_ITEMS);
      const [journals, setJournals] = useState(INITIAL_JOURNALS);
      const [auditTrail, setAuditTrail] = useState([
        { timestamp: '2026-07-29 17:30:12', user: 'Admin User', action: 'SYSTEM_INIT', details: 'Initialized ERP Accounting Engine with standard COA' },
        { timestamp: '2026-07-29 17:45:00', user: 'Procurement Specialist', action: 'JOURNAL_POST', details: 'Auto-posted GRN-9982 for SKU-101 stock update' }
      ]);
      const [toast, setToast] = useState(null);

      // Notification helper
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Add audit log
      const logAudit = (user, action, details) => {
        const newLog = {
          timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19),
          user,
          action,
          details
        };
        setAuditTrail(prev => [newLog, ...prev]);
      };

      // Voucher Auto Generator (Voucher Number Generation)
      const generateVoucherNumber = (prefix = 'JV') => {
        const count = journals.length + 1;
        const year = new Date().getFullYear();
        return `${prefix}-${year}-${String(count).padStart(4, '0')}`;
      };

      // General Ledger Running Balance Calculation Logic
      const generalLedgerEntries = useMemo(() => {
        let entries = [];
        journals.filter(j => j.status === 'Posted').forEach(j => {
          j.lines.forEach(l => {
            entries.push({
              voucherId: j.id,
              date: j.date,
              reference: j.reference,
              narration: j.narration,
              accountCode: l.accountCode,
              accountName: l.accountName,
              debit: l.debit,
              credit: l.credit
            });
          });
        });
        entries.sort((a, b) => new Date(a.date) - new Date(b.date));
        return entries;
      }, [journals]);

      // Calculate Account Balances (Opening + Movement = Closing)
      const accountBalances = useMemo(() => {
        const map = {};
        accounts.forEach(acc => {
          map[acc.code] = {
            ...acc,
            debitSum: 0,
            creditSum: 0,
            netMovement: 0,
            closingBalance: acc.openingBalance
          };
        });

        generalLedgerEntries.forEach(entry => {
          if (map[entry.accountCode]) {
            map[entry.accountCode].debitSum += entry.debit;
            map[entry.accountCode].creditSum += entry.credit;
          }
        });

        Object.keys(map).forEach(code => {
          const acc = map[code];
          if (acc.group === 'Assets' || acc.group === 'Expense') {
            acc.netMovement = acc.debitSum - acc.creditSum;
            acc.closingBalance = acc.openingBalance + acc.netMovement;
          } else {
            acc.netMovement = acc.creditSum - acc.debitSum;
            acc.closingBalance = acc.openingBalance + acc.netMovement;
          }
        });

        return map;
      }, [accounts, generalLedgerEntries]);

      // Financial Metrics (Trial Balance, P&L, Balance Sheet, Cash Flow)
      const financialMetrics = useMemo(() => {
        let totalDebits = 0;
        let totalCredits = 0;
        let totalRevenue = 0;
        let totalCogs = 0;
        let totalOperatingExpenses = 0;
        let totalAssets = 0;
        let totalLiabilities = 0;
        let totalEquity = 0;

        Object.values(accountBalances).forEach(acc => {
          totalDebits += acc.debitSum + (acc.group === 'Assets' || acc.group === 'Expense' ? acc.openingBalance : 0);
          totalCredits += acc.creditSum + (acc.group !== 'Assets' && acc.group !== 'Expense' ? acc.openingBalance : 0);

          if (acc.group === 'Income') totalRevenue += acc.closingBalance;
          if (acc.code === '5010') totalCogs += acc.closingBalance;
          if (acc.group === 'Expense' && acc.code !== '5010') totalOperatingExpenses += acc.closingBalance;

          if (acc.group === 'Assets') totalAssets += acc.closingBalance;
          if (acc.group === 'Liabilities') totalLiabilities += acc.closingBalance;
          if (acc.group === 'Equity') totalEquity += acc.closingBalance;
        });

        const grossProfit = totalRevenue - totalCogs;
        const netProfit = grossProfit - totalOperatingExpenses;
        const finalEquity = totalEquity + netProfit;
        const isTrialBalanceEqual = Math.abs(totalDebits - totalCredits) < 0.01;
        const isBalanceSheetBalanced = Math.abs(totalAssets - (totalLiabilities + finalEquity)) < 0.01;

        return {
          totalDebits,
          totalCredits,
          isTrialBalanceEqual,
          totalRevenue,
          totalCogs,
          grossProfit,
          totalOperatingExpenses,
          netProfit,
          totalAssets,
          totalLiabilities,
          totalEquity,
          finalEquity,
          isBalanceSheetBalanced
        };
      }, [accountBalances]);

      // Auto Journal Posting for Inventory Transaction
      const handleCreateStockTransaction = (item, qty, type, ref) => {
        const amount = qty * item.unitCost;
        const voucherNo = generateVoucherNumber(type === 'PURCHASE' ? 'GRN' : 'SO');
        let newJournalLines = [];

        if (type === 'PURCHASE') {
          newJournalLines = [
            { accountCode: '1030', accountName: 'Raw Material Inventory', debit: amount, credit: 0 },
            { accountCode: '2010', accountName: 'Accounts Payable (AP)', debit: 0, credit: amount }
          ];
        } else {
          const salesAmount = qty * item.sellingPrice;
          newJournalLines = [
            { accountCode: '1020', accountName: 'Accounts Receivable (AR)', debit: salesAmount, credit: 0 },
            { accountCode: '4010', accountName: 'Wholesale Hardware Sales Revenue', debit: 0, credit: salesAmount },
            { accountCode: '5010', accountName: 'Cost of Goods Sold (COGS)', debit: amount, credit: 0 },
            { accountCode: '1040', accountName: 'Finished Goods Inventory', debit: 0, credit: amount }
          ];
        }

        const newJournal = {
          id: voucherNo,
          date: new Date().toISOString().substring(0, 10),
          reference: ref || `${type} Order - ${item.name}`,
          narration: `Automated journal posting generated for ${qty}x ${item.name}`,
          status: 'Posted',
          approvalStatus: 'Approved',
          approvedBy: 'Auto-Post Engine',
          createdBy: 'Supply Chain User',
          lines: newJournalLines
        };

        setInventory(prev => prev.map(i => {
          if (i.id === item.id) {
            return {
              ...i,
              stockQty: type === 'PURCHASE' ? i.stockQty + qty : Math.max(0, i.stockQty - qty)
            };
          }
          return i;
        }));

        setJournals(prev => [newJournal, ...prev]);
        logAudit('Auto-Post Engine', 'AUTO_JOURNAL_POST', `Generated ${voucherNo} for ${type} of ${item.name} ($${amount.toFixed(2)})`);
        showToast(`Auto Journal ${voucherNo} posted successfully!`);
      };

      // Journal Approval Handler
      const handleApproveJournal = (journalId) => {
        setJournals(prev => prev.map(j => {
          if (j.id === journalId) {
            return { ...j, status: 'Posted', approvalStatus: 'Approved', approvedBy: 'Senior Financial Controller' };
          }
          return j;
        }));
        logAudit('Senior Controller', 'JOURNAL_APPROVED', `Approved voucher ${journalId} into General Ledger`);
        showToast(`Voucher ${journalId} approved and posted to General Ledger!`);
      };

      return (
        <div className="flex h-screen overflow-hidden bg-darkbg">
          {/* TOAST NOTIFICATION */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-lg shadow-xl flex items-center space-x-3 text-sm font-semibold transition-all transform translate-y-0 ${toast.type === 'error' ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white glow-emerald'}`}>
              <span>⚡</span>
              <span>{toast.message}</span>
            </div>
          )}

          {/* SIDEBAR NAVIGATION */}
          <aside className="w-64 border-r border-darkborder bg-darkcard flex flex-col justify-between p-4 z-20">
            <div>
              <div className="flex items-center justify-between space-x-3 px-2 py-3 mb-6 border-b border-darkborder">
                <div className="flex items-center space-x-3 overflow-hidden">
                  <img 
                    src={theme === 'dark' ? 'assets/zenora logo - black.png' : 'assets/zenora logo - white.png'} 
                    alt="Zenora Logo" 
                    className="w-10 h-10 object-contain flex-shrink-0 transition-all duration-300"
                  />
                  <div className="min-w-0">
                    <h1 className="font-extrabold text-lg text-white tracking-tight truncate">NexusERP</h1>
                    <p className="text-xs text-indigo-400 font-medium truncate">Supply Chain & Finance</p>
                  </div>
                </div>
                <button 
                  onClick={toggleTheme} 
                  className="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-400 transition cursor-pointer flex-shrink-0"
                  title="Toggle Light / Dark Mode"
                >
                  <span className="text-sm">{theme === 'dark' ? '☀️' : '🌙'}</span>
                </button>
              </div>

              <nav className="space-y-1">
                {[
                  { id: 'dashboard', label: 'Financial Dashboard', icon: '📊' },
                  { id: 'inventory', label: 'Inventory & Supply Chain', icon: '📦' },
                  { id: 'auto-journal', label: 'Auto Journal Posting', icon: '⚡' },
                  { id: 'ledger', label: 'General Ledger Filters', icon: '📖' },
                  { id: 'trial-balance', label: 'Trial Balance Engine', icon: '⚖️' },
                  { id: 'profit-loss', label: 'Profit & Loss Statement', icon: '📈' },
                  { id: 'balance-sheet', label: 'Balance Sheet Engine', icon: '🏛️' },
                  { id: 'cash-flow', label: 'Cash Flow Analysis', icon: '💵' },
                  { id: 'approval-workflow', label: 'Journal Approvals', icon: '🛡️' },
                  { id: 'audit-trail', label: 'Audit Trail & Logs', icon: '🔍' },
                  { id: 'testing-suite', label: 'Module Test Suite', icon: '🧪' },
                  { id: 'backend-code', label: 'NestJS & Postgres Docs', icon: '💻' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl font-medium text-sm transition-all ${activeTab === tab.id ? 'bg-brand-600 text-white glow-indigo font-semibold' : 'text-gray-400 hover:text-gray-200 hover:bg-gray-800/60'}`}
                  >
                    <span className="text-base">{tab.icon}</span>
                    <span className="truncate">{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            {/* STATUS BADGE */}
            <div className="p-3 bg-gray-900/80 rounded-xl border border-darkborder">
              <div className="flex items-center justify-between text-xs text-gray-400 mb-1">
                <span>Ledger Integrity</span>
                <span className={financialMetrics.isTrialBalanceEqual ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>
                  {financialMetrics.isTrialBalanceEqual ? 'BALANCED' : 'UNBALANCED'}
                </span>
              </div>
              <div className="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
                <div className={`h-full ${financialMetrics.isTrialBalanceEqual ? 'bg-emerald-500' : 'bg-rose-500'}`} style={{ width: '100%' }}></div>
              </div>
              <div className="mt-2 text-[10px] text-gray-500 flex justify-between">
                <span>Vouchers: {journals.length}</span>
                <span>Postgres v16 Ready</span>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 flex flex-col overflow-y-auto bg-darkbg">
            {/* TOP BAR */}
            <header className="px-8 py-4 border-b border-darkborder bg-darkcard/50 backdrop-blur sticky top-0 z-10 flex items-center justify-between">
              <div>
                <h2 className="text-xl font-bold text-white tracking-tight capitalize">
                  {activeTab.replace('-', ' ')} Overview
                </h2>
                <p className="text-xs text-gray-400">Automated Accounting & Real-time Supply Chain Ledger Engine</p>
              </div>

              <div className="flex items-center space-x-4">
                <div className="bg-gray-900 px-3 py-1.5 rounded-lg border border-darkborder flex items-center space-x-2 text-xs">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="text-gray-300 font-mono">DB Isolation: SERIALIZABLE</span>
                </div>
                <button 
                  onClick={() => {
                    const csvContent = "data:text/csv;charset=utf-8," + journals.map(j => `${j.id},${j.date},${j.reference},${j.status}`).join("\n");
                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", `General_Ledger_Export_${new Date().toISOString().substring(0,10)}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    showToast("Exported Ledger CSV!");
                  }}
                  className="px-3.5 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-semibold rounded-lg border border-gray-700 transition"
                >
                  📥 Export CSV
                </button>
              </div>
            </header>

            {/* TAB CONTENT VIEWS */}
            <div className="p-8 space-y-6">
              {activeTab === 'dashboard' && (
                <DashboardView 
                  metrics={financialMetrics} 
                  journals={journals} 
                  inventory={inventory}
                  accounts={accountBalances}
                />
              )}

              {activeTab === 'inventory' && (
                <InventoryView 
                  inventory={inventory} 
                  onTransaction={handleCreateStockTransaction} 
                />
              )}

              {activeTab === 'auto-journal' && (
                <AutoJournalView 
                  journals={journals} 
                  accounts={accounts}
                  inventory={inventory}
                  onAutoPost={handleCreateStockTransaction}
                />
              )}

              {activeTab === 'ledger' && (
                <LedgerView 
                  entries={generalLedgerEntries} 
                  accounts={accounts} 
                  accountBalances={accountBalances}
                />
              )}

              {activeTab === 'trial-balance' && (
                <TrialBalanceView 
                  accountBalances={accountBalances} 
                  metrics={financialMetrics} 
                />
              )}

              {activeTab === 'profit-loss' && (
                <ProfitLossView 
                  metrics={financialMetrics} 
                  accountBalances={accountBalances} 
                />
              )}

              {activeTab === 'balance-sheet' && (
                <BalanceSheetView 
                  metrics={financialMetrics} 
                  accountBalances={accountBalances} 
                />
              )}

              {activeTab === 'cash-flow' && (
                <CashFlowView 
                  accountBalances={accountBalances} 
                  metrics={financialMetrics} 
                />
              )}

              {activeTab === 'approval-workflow' && (
                <ApprovalWorkflowView 
                  journals={journals} 
                  onApprove={handleApproveJournal} 
                />
              )}

              {activeTab === 'audit-trail' && (
                <AuditTrailView auditTrail={auditTrail} />
              )}

              {activeTab === 'testing-suite' && (
                <TestingSuiteView 
                  journals={journals} 
                  accountBalances={accountBalances}
                  metrics={financialMetrics}
                />
              )}

              {activeTab === 'backend-code' && (
                <BackendDocsView />
              )}
            </div>
          </main>
        </div>
      );
    }

    // --- SUB-COMPONENTS & TAB VIEWS ---

    // 1. FINANCIAL DASHBOARD VIEW
    function DashboardView({ metrics, journals, inventory, accounts }) {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (!chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInstance.current) chartInstance.current.destroy();

{`CREATE TABLE accounts (
  code VARCHAR(20) PRIMARY KEY,
  name VARCHAR(255) NOT NULL,
  account_group VARCHAR(50) NOT NULL,
  account_type VARCHAR(50) NOT NULL,
  opening_balance NUMERIC(15, 2) DEFAULT 0.00

CREATE TABLE journal_entries (
  id VARCHAR(50) PRIMARY KEY,
  entry_date DATE NOT NULL,
  reference VARCHAR(100),
  narration TEXT,
  status VARCHAR(20) DEFAULT 'Posted',
  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE journal_lines (
  id SERIAL PRIMARY KEY,
  journal_id VARCHAR(50) REFERENCES journal_entries(id),
  account_code VARCHAR(20) REFERENCES accounts(code),
  debit NUMERIC(15, 2) DEFAULT 0.00,
  credit NUMERIC(15, 2) DEFAULT 0.00
);`}
              </pre>

            <div>
              <h4 className="text-xs font-mono font-bold text-indigo-400 mb-2">2. NestJS Auto Posting Service (src/journals/journals.service.ts)</h4>
              <pre className="p-4 bg-gray-950 rounded-xl text-[11px] text-indigo-300 font-mono overflow-x-auto border border-darkborder">
{`@Injectable()
export class JournalsService {
  constructor(@InjectRepository(JournalEntry) private journalRepo: Repository<JournalEntry>) {}

  async autoPostInventoryJournal(dto: CreateInventoryJournalDto) {
    const queryRunner = this.dataSource.createQueryRunner();
    await queryRunner.connect();
    await queryRunner.startTransaction('SERIALIZABLE');
    try {
      // Enforce Debit = Credit validation
      const totalDebit = dto.lines.reduce((sum, l) => sum + l.debit, 0);
      const totalCredit = dto.lines.reduce((sum, l) => sum + l.credit, 0);
      if (Math.abs(totalDebit - totalCredit) > 0.001) {
        throw new BadRequestException('Unbalanced Journal Entry');
      }
      const journal = this.journalRepo.create(dto);
      await queryRunner.manager.save(journal);
      await queryRunner.commitTransaction();
      return journal;
    } catch (err) {
      await queryRunner.rollbackTransaction();
      throw err;
    }
  }
}`}
              </pre>
