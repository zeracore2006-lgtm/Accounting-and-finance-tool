    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
            },

              emerald: '#10b981',

    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    @media print {
      body { background: white !important; color: black !important; }
      aside, header, button, .no-print { display: none !important; }
      .print-container { width: 100% !important; margin: 0 !important; padding: 0 !important; }

</head>

      { id: '5010', code: '5010', name: 'Cost of Goods Sold (COGS)', type: 'Expense', category: 'Direct Cost', balance: 138000.00, description: 'Raw materials & direct manufacturing cost' },

      { id: '5030', code: '5030', name: 'Warehouse Rent & Maintenance', type: 'Expense', category: 'Operating Expense', balance: 22000.00, description: 'Facility leasing and utilities' },
      { id: '5040', code: '5040', name: 'Supply Chain SaaS Licenses', type: 'Expense', category: 'Operating Expense', balance: 4100.00, description: 'WMS, ERP & EDI API subscriptions' }

    const INITIAL_JOURNALS = [

        lines: [

          { accountId: '4010', accountCode: '4010', accountName: 'Direct B2B Wholesale Sales', debit: 0, credit: 34000.00 },
          { accountId: '5010', accountCode: '5010', accountName: 'Cost of Goods Sold (COGS)', debit: 19800.00, credit: 0 },

        ]
      },

        ]
      }
    ];

    const INITIAL_CUSTOMERS = [
      { id: 'CUST-001', name: 'Apex Global Logistics', contact: 'Sarah Jenkins', email: 's.jenkins@apexglobal.com', balance: 24000.00, terms: 'Net 30', status: 'Active' },
      { id: 'CUST-002', name: 'Titan Tech Hardware', contact: 'Marcus Vance', email: 'mvance@titantech.io', balance: 18400.00, terms: 'Net 15', status: 'Active' },
      { id: 'CUST-003', name: 'Vanguard Industrial Supply', contact: 'Elena Rostova', email: 'elena@vanguard.com', balance: 10000.00, terms: 'Net 45', status: 'Active' }
    ];

    const INITIAL_INVOICES = [
      { id: 'INV-1001', customerId: 'CUST-001', customerName: 'Apex Global Logistics', date: '2026-06-15', dueDate: '2026-07-15', amount: 24000.00, paidAmount: 0, status: 'Overdue (30+ Days)' },
      { id: 'INV-1002', customerId: 'CUST-002', customerName: 'Titan Tech Hardware', date: '2026-07-05', dueDate: '2026-07-20', amount: 18400.00, paidAmount: 0, status: 'Overdue (1-30 Days)' },
      { id: 'INV-1003', customerId: 'CUST-003', customerName: 'Vanguard Industrial Supply', date: '2026-07-18', dueDate: '2026-08-18', amount: 10000.00, paidAmount: 0, status: 'Current' }
    ];

    const INITIAL_SUPPLIERS = [
      { id: 'SUP-001', name: 'MetalCorp Heavy Materials Direct', contact: 'David Zhang', email: 'orders@metalcorp.com', balance: 22500.00, rating: 'Tier 1 Preferred' },
      { id: 'SUP-002', name: 'Pacifica Ocean Logistics 3PL', contact: 'Captain Harris', email: 'dispatch@pacifica-freight.com', balance: 18700.00, rating: 'Tier 1 Preferred' }
    ];

    const INITIAL_BILLS = [
      { id: 'BILL-901', supplierId: 'SUP-001', supplierName: 'MetalCorp Heavy Materials Direct', billDate: '2026-07-02', dueDate: '2026-08-02', amount: 22500.00, status: 'Unpaid', category: 'Raw Materials' },
      { id: 'BILL-902', supplierId: 'SUP-002', supplierName: 'Pacifica Ocean Logistics 3PL', billDate: '2026-07-12', dueDate: '2026-08-12', amount: 18700.00, status: 'Unpaid', category: 'Freight Shipping' }
    ];

    const INITIAL_BANK_TRANSACTIONS = [
      { id: 'TXN-881', date: '2026-07-25', description: 'ACH Deposit - Titan Tech Settlement', amount: 12000.00, type: 'Credit', status: 'Reconciled', accountId: '1010' },
      { id: 'TXN-882', date: '2026-07-24', description: 'Wire Transfer - Ocean Freight Carrier', amount: -6500.00, type: 'Debit', status: 'Pending Match', accountId: '1010' },
      { id: 'TXN-883', date: '2026-07-22', description: 'Petty Cash Replenishment Vault Transfer', amount: -500.00, type: 'Debit', status: 'Reconciled', accountId: '1020' }
    ];

    const INITIAL_TAX_RATES = [
      { id: 'TAX-01', name: 'Standard GST / VAT Rate', rate: 18.0, type: 'Output Tax', description: 'Standard rate applied to B2B equipment sales' },
      { id: 'TAX-02', name: 'Import Duty Tax', rate: 7.5, type: 'Input Tax', description: 'Customs duty on raw material ocean containers' },
      { id: 'TAX-03', name: 'State Commercial Sales Tax', rate: 6.0, type: 'Output Tax', description: 'Local municipal sales tax' }
    ];

    // --- MAIN REACT APPLICATION ---
    function App() {
      // Navigation Tab State (11 Modules + Backend & Database Tabs)
      const [activeTab, setActiveTab] = useState('dashboard');
      
      // Core Application Stateful Data
      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('nexus_settings');
        return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
      });

      const [accounts, setAccounts] = useState(() => {
        const saved = localStorage.getItem('nexus_accounts');
        return saved ? JSON.parse(saved) : INITIAL_ACCOUNTS;
      });

      const [journals, setJournals] = useState(() => {
        const saved = localStorage.getItem('nexus_journals');
        return saved ? JSON.parse(saved) : INITIAL_JOURNALS;
      });

      const [customers, setCustomers] = useState(() => {
        const saved = localStorage.getItem('nexus_customers');
        return saved ? JSON.parse(saved) : INITIAL_CUSTOMERS;
      });

      const [invoices, setInvoices] = useState(() => {
        const saved = localStorage.getItem('nexus_invoices');
        return saved ? JSON.parse(saved) : INITIAL_INVOICES;
      });

      const [suppliers, setSuppliers] = useState(() => {
        const saved = localStorage.getItem('nexus_suppliers');
        return saved ? JSON.parse(saved) : INITIAL_SUPPLIERS;
      });

      const [bills, setBills] = useState(() => {
        const saved = localStorage.getItem('nexus_bills');
        return saved ? JSON.parse(saved) : INITIAL_BILLS;
      });

      const [bankTxns, setBankTxns] = useState(() => {
        const saved = localStorage.getItem('nexus_bank_txns');
        return saved ? JSON.parse(saved) : INITIAL_BANK_TRANSACTIONS;
      });

      const [taxRates, setTaxRates] = useState(() => {
        const saved = localStorage.getItem('nexus_tax_rates');
        return saved ? JSON.parse(saved) : INITIAL_TAX_RATES;
      });

      // Modals and Toasts
      const [modalState, setModalState] = useState({ open: false, type: null, payload: null });
      const [toast, setToast] = useState(null);
      const [selectedLedgerAccount, setSelectedLedgerAccount] = useState('1010');

      // Persistence side-effects
      useEffect(() => localStorage.setItem('nexus_settings', JSON.stringify(settings)), [settings]);
      useEffect(() => localStorage.setItem('nexus_accounts', JSON.stringify(accounts)), [accounts]);
      useEffect(() => localStorage.setItem('nexus_journals', JSON.stringify(journals)), [journals]);
      useEffect(() => localStorage.setItem('nexus_customers', JSON.stringify(customers)), [customers]);
      useEffect(() => localStorage.setItem('nexus_invoices', JSON.stringify(invoices)), [invoices]);
      useEffect(() => localStorage.setItem('nexus_suppliers', JSON.stringify(suppliers)), [suppliers]);
      useEffect(() => localStorage.setItem('nexus_bills', JSON.stringify(bills)), [bills]);
      useEffect(() => localStorage.setItem('nexus_bank_txns', JSON.stringify(bankTxns)), [bankTxns]);
      useEffect(() => localStorage.setItem('nexus_tax_rates', JSON.stringify(taxRates)), [taxRates]);

      // Re-initialize Lucide Icons after DOM updates
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const triggerToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      const fmtCurr = (amount) => {
        const num = Number(amount || 0);
        return `${settings.currencySymbol}${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      };

      // Financial Calculation Engine
      const totals = useMemo(() => {
        const assets = accounts.filter(a => a.type === 'Asset').reduce((s, a) => s + Number(a.balance), 0);
        const liabilities = accounts.filter(a => a.type === 'Liability').reduce((s, a) => s + Number(a.balance), 0);
        const equity = accounts.filter(a => a.type === 'Equity').reduce((s, a) => s + Number(a.balance), 0);
        const revenue = accounts.filter(a => a.type === 'Revenue').reduce((s, a) => s + Number(a.balance), 0);
        const expenses = accounts.filter(a => a.type === 'Expense').reduce((s, a) => s + Number(a.balance), 0);
        const profit = revenue - expenses;

        const receivables = accounts.find(a => a.id === '1030')?.balance || 0;
        const payables = accounts.find(a => a.id === '2010')?.balance || 0;
        const bankBalance = (accounts.find(a => a.id === '1010')?.balance || 0) + (accounts.find(a => a.id === '1020')?.balance || 0);
        const cashFlow = bankBalance + receivables - payables;

        return { assets, liabilities, equity, revenue, expenses, profit, receivables, payables, bankBalance, cashFlow };
      }, [accounts]);

      // Post New Double-Entry Journal Entry
      const handlePostJournal = (newEntry) => {
        const entryId = `JE-2026-00${journals.length + 1}`;
        const entry = {
          id: entryId,
          date: newEntry.date || new Date().toISOString().split('T')[0],
          reference: newEntry.reference,
          notes: newEntry.notes,
          status: 'Posted',
          lines: newEntry.lines
        };

        // Update balances in CoA according to Accounting Standard Rules
        setAccounts(prevAccs => {
          return prevAccs.map(acc => {
            let bal = Number(acc.balance);
            newEntry.lines.forEach(line => {
              if (line.accountId === acc.id) {
                const dr = Number(line.debit || 0);
                const cr = Number(line.credit || 0);
                if (acc.type === 'Asset' || acc.type === 'Expense') {
                  bal += (dr - cr);
                } else {
                  // Liability, Equity, Revenue
                  bal += (cr - dr);
                }
              }
            });
            return { ...acc, balance: bal };
          });
        });

        setJournals(prev => [entry, ...prev]);
        setModalState({ open: false, type: null, payload: null });
        triggerToast(`Journal Entry ${entryId} successfully posted & ledger updated!`);
      };

      // Add New Account
      const handleAddAccount = (accData) => {
        if (accounts.some(a => a.code === accData.code)) {
          alert(`Account code ${accData.code} already exists! Use a unique number.`);
          return;
        }
        const newAcc = {
          id: accData.code,
          code: accData.code,
          name: accData.name,
          type: accData.type,
          category: accData.category || accData.type,
          balance: Number(accData.balance || 0),
          description: accData.description
        };
        setAccounts(prev => [...prev, newAcc]);
        setModalState({ open: false, type: null, payload: null });
        triggerToast(`Account ${newAcc.code} - ${newAcc.name} created!`);
      };

      // Create Supplier Bill
      const handleCreateBill = (billData) => {
        const newBill = {
          id: `BILL-${100 + bills.length + 1}`,
          supplierId: billData.supplierId,
          supplierName: suppliers.find(s => s.id === billData.supplierId)?.name || 'Supplier',
          billDate: billData.billDate,
          dueDate: billData.dueDate,
          amount: Number(billData.amount),
          status: 'Unpaid',
          category: billData.category
        };
        setBills(prev => [newBill, ...prev]);

        // Post accounting entry automatically (Debit Expense/Inventory, Credit AP)
        handlePostJournal({
          date: billData.billDate,
          reference: `Bill #${newBill.id}`,
          notes: `Supplier bill from ${newBill.supplierName}`,
          lines: [
            { accountId: '5010', accountCode: '5010', accountName: 'Cost of Goods Sold (COGS)', debit: newBill.amount, credit: 0 },
            { accountId: '2010', accountCode: '2010', accountName: 'Accounts Payable (AP)', debit: 0, credit: newBill.amount }
          ]
        });

        setModalState({ open: false, type: null, payload: null });
        triggerToast(`Supplier Bill ${newBill.id} created & Accounts Payable credited!`);
      };

      // Receive AR Payment
      const handleReceivePayment = (invId) => {
        setInvoices(prev => prev.map(inv => {
          if (inv.id === invId) {
            return { ...inv, status: 'Paid', paidAmount: inv.amount };
          }
          return inv;
        }));

        const inv = invoices.find(i => i.id === invId);
        if (inv) {
          handlePostJournal({
            date: new Date().toISOString().split('T')[0],
            reference: `AR Payment Receipt - ${inv.id}`,
            notes: `Customer payment received for invoice ${inv.id}`,
            lines: [
              { accountId: '1010', accountCode: '1010', accountName: 'Primary Operating Bank Account', debit: inv.amount, credit: 0 },
              { accountId: '1030', accountCode: '1030', accountName: 'Accounts Receivable (AR)', debit: 0, credit: inv.amount }
            ]
          });
        }
        triggerToast(`Payment received for Invoice ${invId}. Funds deposited to Bank!`);
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          {/* TOAST ALERTS */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center space-x-3 bg-emerald-600 text-white px-5 py-3 rounded-2xl shadow-2xl animate-bounce border border-emerald-400/40">
              <i data-lucide="check-circle-2" className="w-5 h-5"></i>
              <span className="font-semibold text-sm">{toast}</span>
            </div>
          )}

          {/* MAIN SIDEBAR NAVIGATION */}
          <aside className="w-full md:w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 sticky top-0 md:h-screen z-30 overflow-y-auto no-print">
            <div>
              {/* ERP Brand Header */}
              <div className="flex items-center space-x-3 px-3 py-3 mb-4 bg-slate-950/60 rounded-2xl border border-slate-800">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-cyan-500 to-emerald-400 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                  <i data-lucide="boxes" className="w-6 h-6 text-white"></i>
                </div>
                <div>
                  <h1 className="font-extrabold text-lg text-white tracking-tight leading-none">NEXUS ERP</h1>
                  <span className="text-[10px] font-bold text-cyan-400 uppercase tracking-wider">Supply & Accounting</span>
                </div>
              </div>

              {/* Module Menu */}
              <nav className="space-y-1">
                <div className="px-3 pt-2 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-widest">ACCOUNTING & FINANCE</div>
                
                {[
                  { id: 'dashboard', label: '1. Dashboard', icon: 'layout-dashboard' },
                  { id: 'coa', label: '2. Chart of Accounts', icon: 'book-open' },
                  { id: 'ledger', label: '3. General Ledger', icon: 'file-text' },
                  { id: 'journal', label: '4. Journal Entries', icon: 'pen-tool' },
                  { id: 'ar', label: '5. Accounts Receivable', icon: 'arrow-down-left' },
                  { id: 'ap', label: '6. Accounts Payable', icon: 'arrow-up-right' },
                  { id: 'banking', label: '7. Banking & Cash', icon: 'landmark' },
                  { id: 'bills', label: '8. Supplier Bills', icon: 'receipt' },
                  { id: 'reports', label: '9. Financial Reports', icon: 'bar-chart-3' },
                  { id: 'tax', label: '10. Tax Management', icon: 'percent' },
                  { id: 'settings', label: '11. Financial Settings', icon: 'sliders' },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                      activeTab === item.id
                        ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 shadow-inner'
                        : 'text-slate-400 hover:bg-slate-800/70 hover:text-slate-200'
                    }`}
                  >
                    <i data-lucide={item.icon} className="w-4 h-4"></i>
                    <span>{item.label}</span>
                  </button>
                ))}

                <div className="px-3 pt-4 pb-1 text-[10px] font-bold text-slate-500 uppercase tracking-widest">TECH ARCHITECTURE CODE</div>
                <button
                  onClick={() => setActiveTab('code_backend')}
                  className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                    activeTab === 'code_backend' ? 'bg-cyan-600/20 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 hover:bg-slate-800/70'
                  }`}
                >
                  <i data-lucide="server" className="w-4 h-4"></i>
                  <span>NestJS Backend Code</span>
                </button>
                <button
                  onClick={() => setActiveTab('code_db')}
                  className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                    activeTab === 'code_db' ? 'bg-emerald-600/20 text-emerald-400 border border-emerald-500/30' : 'text-slate-400 hover:bg-slate-800/70'
                  }`}
                >
                  <i data-lucide="database" className="w-4 h-4"></i>
                  <span>PostgreSQL DB Schema</span>
                </button>
              </nav>
            </div>

            {/* User Account / Footer */}
            <div className="pt-4 border-t border-slate-800/80">
              <div className="flex items-center space-x-3 px-2">
                <div className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center font-bold text-xs text-indigo-400 border border-slate-700">
                  CFO
                </div>
                <div className="flex-1 overflow-hidden">
                  <div className="text-xs font-bold text-slate-200 truncate">Supply Chain Controller</div>
                  <div className="text-[10px] text-emerald-400 font-medium">● Fiscal Year {settings.fiscalYearStart.split('-')[0] || '2026'} Active</div>
                </div>
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT WORKSPACE */}
          <main className="flex-1 p-4 md:p-8 overflow-y-auto print-container">
            
            {/* MODULE 1: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-extrabold text-white tracking-tight">Financial Dashboard</h2>
                    <p className="text-xs text-slate-400 mt-1">Real-time financial metrics, cash balances, receivables & payables</p>
                  </div>
                  <div className="flex items-center space-x-3">
                    <button onClick={() => setModalState({ open: true, type: 'journal' })} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30 transition flex items-center space-x-2">
                      <i data-lucide="plus" className="w-4 h-4"></i>
                      <span>New Journal Entry</span>
                    </button>
                  </div>
                </div>

                {/* 7 KPI CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="glass-card p-5 rounded-2xl relative overflow-hidden">
                    <div className="text-xs font-semibold text-slate-400">Total Revenue</div>
                    <div className="text-2xl font-extrabold text-emerald-400 mt-2">{fmtCurr(totals.revenue)}</div>
                    <div className="text-[10px] text-emerald-500 font-medium mt-1">↑ +14.2% vs previous period</div>
                    <i data-lucide="trending-up" className="w-8 h-8 text-emerald-500/20 absolute top-4 right-4"></i>
                  </div>

                  <div className="glass-card p-5 rounded-2xl relative overflow-hidden">
                    <div className="text-xs font-semibold text-slate-400">Total Expenses</div>
                    <div className="text-2xl font-extrabold text-rose-400 mt-2">{fmtCurr(totals.expenses)}</div>
                    <div className="text-[10px] text-slate-400 mt-1">COGS + Ocean Freight + SaaS</div>
                    <i data-lucide="trending-down" className="w-8 h-8 text-rose-500/20 absolute top-4 right-4"></i>
                  </div>

                  <div className="glass-card p-5 rounded-2xl relative overflow-hidden">
                    <div className="text-xs font-semibold text-slate-400">Net Profit</div>
                    <div className="text-2xl font-extrabold text-cyan-400 mt-2">{fmtCurr(totals.profit)}</div>
                    <div className="text-[10px] text-cyan-400 font-medium mt-1">Margin: {((totals.profit / (totals.revenue || 1)) * 100).toFixed(1)}%</div>
                    <i data-lucide="dollar-sign" className="w-8 h-8 text-cyan-500/20 absolute top-4 right-4"></i>
                  </div>

                  <div className="glass-card p-5 rounded-2xl relative overflow-hidden">
                    <div className="text-xs font-semibold text-slate-400">Operating Bank Balance</div>
                    <div className="text-2xl font-extrabold text-indigo-400 mt-2">{fmtCurr(totals.bankBalance)}</div>
                    <div className="text-[10px] text-slate-400 mt-1">Liquid Cash Accounts</div>
                    <i data-lucide="landmark" className="w-8 h-8 text-indigo-500/20 absolute top-4 right-4"></i>
                  </div>

                  <div className="glass-card p-5 rounded-2xl relative overflow-hidden">
                    <div className="text-xs font-semibold text-slate-400">Accounts Receivable (AR)</div>
                    <div className="text-2xl font-extrabold text-amber-400 mt-2">{fmtCurr(totals.receivables)}</div>
                    <div className="text-[10px] text-amber-500 font-medium mt-1">Customer Uncollected Balances</div>
                    <i data-lucide="arrow-down-left" className="w-8 h-8 text-amber-500/20 absolute top-4 right-4"></i>
                  </div>

                  <div className="glass-card p-5 rounded-2xl relative overflow-hidden">
                    <div className="text-xs font-semibold text-slate-400">Accounts Payable (AP)</div>
                    <div className="text-2xl font-extrabold text-rose-400 mt-2">{fmtCurr(totals.payables)}</div>
                    <div className="text-[10px] text-rose-400 font-medium mt-1">Outstanding Supplier Bills</div>
                    <i data-lucide="arrow-up-right" className="w-8 h-8 text-rose-500/20 absolute top-4 right-4"></i>
                  </div>

                  <div className="glass-card p-5 rounded-2xl sm:col-span-2 relative overflow-hidden bg-gradient-to-br from-indigo-950/60 to-slate-900">
                    <div className="text-xs font-semibold text-indigo-300">Net Estimated Cash Flow Position</div>
                    <div className="text-2xl font-extrabold text-white mt-2">{fmtCurr(totals.cashFlow)}</div>
                    <div className="text-[10px] text-indigo-200 mt-1">Formula: Bank Balance + AR - AP</div>
                    <i data-lucide="activity" className="w-8 h-8 text-indigo-400/30 absolute top-4 right-4"></i>
                  </div>
                </div>

                {/* RECENT TRANSACTIONS QUICK VIEW */}
                <div className="glass-card rounded-2xl p-6">
                  <h3 className="text-sm font-bold text-white mb-4 flex items-center space-x-2">
                    <i data-lucide="history" className="w-4 h-4 text-indigo-400"></i>
                    <span>Recent Journal Activity Feed</span>
                  </h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-slate-800 text-slate-400 uppercase tracking-wider font-semibold">
                          <th className="py-3 px-4">Entry ID</th>
                          <th className="py-3 px-4">Date</th>
                          <th className="py-3 px-4">Reference</th>
                          <th className="py-3 px-4">Notes</th>
                          <th className="py-3 px-4 text-right">Debit Total</th>
                          <th className="py-3 px-4 text-center">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {journals.slice(0, 5).map(j => {
                          const debTotal = j.lines.reduce((s, l) => s + Number(l.debit || 0), 0);
                          return (
                            <tr key={j.id} className="hover:bg-slate-800/40 transition">
                              <td className="py-3 px-4 font-mono font-bold text-indigo-400">{j.id}</td>
                              <td className="py-3 px-4 text-slate-300">{j.date}</td>
                              <td className="py-3 px-4 text-slate-300 font-medium">{j.reference}</td>
                              <td className="py-3 px-4 text-slate-400">{j.notes}</td>
                              <td className="py-3 px-4 text-right font-bold text-emerald-400">{fmtCurr(debTotal)}</td>
                              <td className="py-3 px-4 text-center">
                                <span className="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full font-semibold text-[10px]">
                                  {j.status}
                                </span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* MODULE 2: CHART OF ACCOUNTS */}
            {activeTab === 'coa' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-extrabold text-white tracking-tight">Chart of Accounts</h2>
                    <p className="text-xs text-slate-400 mt-1">Assets, Liabilities, Equity, Revenue, and Expense account mapping</p>
                  </div>
                  <button onClick={() => setModalState({ open: true, type: 'account' })} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30 transition flex items-center space-x-2">
                    <i data-lucide="plus-circle" className="w-4 h-4"></i>
                    <span>Add New Account</span>
                  </button>
                </div>

                {['Asset', 'Liability', 'Equity', 'Revenue', 'Expense'].map(accType => {
                  const filtered = accounts.filter(a => a.type === accType);
                  const categoryTotal = filtered.reduce((s, a) => s + Number(a.balance), 0);
                  const colorMap = {
                    Asset: 'border-emerald-500/30 text-emerald-400',
                    Liability: 'border-rose-500/30 text-rose-400',
                    Equity: 'border-cyan-500/30 text-cyan-400',
                    Revenue: 'border-indigo-500/30 text-indigo-400',
                    Expense: 'border-amber-500/30 text-amber-400'
                  };

                  return (
                    <div key={accType} className="glass-card rounded-2xl p-5 space-y-3">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                        <div className="flex items-center space-x-3">
                          <span className={`px-3 py-1 bg-slate-900 border rounded-xl text-xs font-bold ${colorMap[accType]}`}>
                            {accType} Accounts
                          </span>
                          <span className="text-xs text-slate-400 font-medium">{filtered.length} Accounts Listed</span>
                        </div>
                        <div className="text-sm font-extrabold text-slate-200">
                          Total: <span className={colorMap[accType].split(' ')[1]}>{fmtCurr(categoryTotal)}</span>
                        </div>
                      </div>

                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead>
                            <tr className="text-slate-500 uppercase tracking-wider text-[10px] font-bold border-b border-slate-800/50">
                              <th className="py-2 px-3">Code</th>
                              <th className="py-2 px-3">Account Name</th>
                              <th className="py-2 px-3">Category</th>
                              <th className="py-2 px-3">Description</th>
                              <th className="py-2 px-3 text-right">Current Balance</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800/40">
                            {filtered.map(acc => (
                              <tr key={acc.id} className="hover:bg-slate-800/30 transition">
                                <td className="py-2.5 px-3 font-mono font-bold text-slate-300">{acc.code}</td>
                                <td className="py-2.5 px-3 font-semibold text-white">{acc.name}</td>
                                <td className="py-2.5 px-3 text-slate-400">{acc.category}</td>
                                <td className="py-2.5 px-3 text-slate-400 max-w-xs truncate">{acc.description}</td>
                                <td className="py-2.5 px-3 text-right font-mono font-bold text-slate-100">{fmtCurr(acc.balance)}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* MODULE 3: GENERAL LEDGER */}
            {activeTab === 'ledger' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-extrabold text-white tracking-tight">General Ledger</h2>
                    <p className="text-xs text-slate-400 mt-1">Detailed account ledgers, debits, credits, and running balance audit logs</p>
                  </div>
                  <div className="flex items-center space-x-3">
                    <label className="text-xs text-slate-400 font-semibold">Select Account:</label>
                    <select
                      value={selectedLedgerAccount}
                      onChange={(e) => setSelectedLedgerAccount(e.target.value)}
                      className="bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs font-medium focus:ring-2 focus:ring-indigo-500"
                    >
                      {accounts.map(a => (
                        <option key={a.id} value={a.id}>{a.code} - {a.name} ({a.type})</option>
                      ))}
                    </select>
                  </div>
                </div>

                {(() => {
                  const targetAcc = accounts.find(a => a.id === selectedLedgerAccount) || accounts[0];
                  let runningBalance = 0;
                  
                  // Extract all matching transaction lines across journals
                  const ledgerLines = [];
                  journals.forEach(j => {
                    j.lines.forEach(l => {
                      if (l.accountId === targetAcc.id) {
                        ledgerLines.push({
                          journalId: j.id,
                          date: j.date,
                          reference: j.reference,
                          notes: j.notes,
                          debit: Number(l.debit || 0),
                          credit: Number(l.credit || 0)
                        });
                      }
                    });
                  });

                  return (
                    <div className="space-y-4">
                      <div className="glass-card rounded-2xl p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                          <div className="text-xs font-semibold text-indigo-400 uppercase tracking-widest">Account Ledger Summary</div>
                          <h3 className="text-xl font-extrabold text-white mt-1">{targetAcc.code} - {targetAcc.name}</h3>
                          <div className="text-xs text-slate-400 mt-1">Type: {targetAcc.type} | Category: {targetAcc.category}</div>
                        </div>
                        <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 text-right">
                          <div className="text-xs text-slate-400">Current Total Balance</div>
                          <div className="text-2xl font-black text-emerald-400">{fmtCurr(targetAcc.balance)}</div>
                        </div>
                      </div>

                      <div className="glass-card rounded-2xl p-6">
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs">
                            <thead>
                              <tr className="border-b border-slate-800 text-slate-400 uppercase tracking-wider font-semibold">
                                <th className="py-3 px-4">Date</th>
                                <th className="py-3 px-4">Journal Ref</th>
                                <th className="py-3 px-4">Transaction Memo</th>
                                <th className="py-3 px-4 text-right">Debit ({settings.currencySymbol})</th>
                                <th className="py-3 px-4 text-right">Credit ({settings.currencySymbol})</th>
                                <th className="py-3 px-4 text-right">Running Balance</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/60">
                              <tr className="bg-slate-900/40 font-semibold text-slate-300">
                                <td className="py-3 px-4">2026-01-01</td>
                                <td className="py-3 px-4 font-mono">INIT-00</td>
                                <td className="py-3 px-4 italic text-slate-400">Opening Balance Carried Forward</td>
                                <td className="py-3 px-4 text-right">-</td>
                                <td className="py-3 px-4 text-right">-</td>
                                <td className="py-3 px-4 text-right font-mono font-bold text-slate-200">{fmtCurr(0)}</td>
                              </tr>
                              {ledgerLines.length === 0 ? (
                                <tr>
                                  <td colSpan="6" className="py-8 text-center text-slate-500">No postings recorded for this account yet.</td>
                                </tr>
                              ) : (
                                ledgerLines.map((line, idx) => {
                                  if (targetAcc.type === 'Asset' || targetAcc.type === 'Expense') {
                                    runningBalance += (line.debit - line.credit);
                                  } else {
                                    runningBalance += (line.credit - line.debit);
                                  }
                                  return (
                                    <tr key={idx} className="hover:bg-slate-800/40 transition">
                                      <td className="py-3 px-4 text-slate-300">{line.date}</td>
                                      <td className="py-3 px-4 font-mono font-bold text-indigo-400">{line.journalId}</td>
                                      <td className="py-3 px-4 text-slate-300">{line.notes} <span className="text-[10px] text-slate-500">({line.reference})</span></td>
                                      <td className="py-3 px-4 text-right font-mono text-emerald-400 font-medium">{line.debit > 0 ? fmtCurr(line.debit) : '-'}</td>
                                      <td className="py-3 px-4 text-right font-mono text-rose-400 font-medium">{line.credit > 0 ? fmtCurr(line.credit) : '-'}</td>
                                      <td className="py-3 px-4 text-right font-mono font-bold text-white">{fmtCurr(runningBalance)}</td>
                                    </tr>
                                  );
                                })
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* MODULE 4: JOURNAL */}
            {activeTab === 'journal' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-extrabold text-white tracking-tight">Journal Entries</h2>
                    <p className="text-xs text-slate-400 mt-1">Double-entry accounting journal creation and audit trail history</p>
                  </div>
                  <button onClick={() => setModalState({ open: true, type: 'journal' })} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30 transition flex items-center space-x-2">
                    <i data-lucide="plus" className="w-4 h-4"></i>
                    <span>Create Journal Entry</span>
                  </button>
                </div>

                <div className="glass-card rounded-2xl p-6">
                  <div className="space-y-6">
                    {journals.map(j => (
                      <div key={j.id} className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-800 pb-3">
                          <div className="flex items-center space-x-3">
                            <span className="px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-xl font-mono font-bold text-xs">
                              {j.id}
                            </span>
                            <span className="text-xs font-semibold text-slate-300">{j.date}</span>
                            <span className="text-xs text-slate-400">Ref: <strong className="text-slate-200">{j.reference}</strong></span>
                          </div>
                          <span className="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full text-[10px] font-bold self-start">
                            ● {j.status}
                          </span>
                        </div>

                        <div className="text-xs text-slate-300 font-medium italic">Memo: "{j.notes}"</div>

                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs">
                            <thead>
                              <tr className="text-slate-500 uppercase tracking-wider text-[10px] font-bold">
                                <th className="py-2 px-3">Account Code</th>
                                <th className="py-2 px-3">Account Title</th>
                                <th className="py-2 px-3 text-right">Debit ({settings.currencySymbol})</th>
                                <th className="py-2 px-3 text-right">Credit ({settings.currencySymbol})</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/40">
                              {j.lines.map((line, lIdx) => (
                                <tr key={lIdx} className="hover:bg-slate-800/20">
                                  <td className="py-2 px-3 font-mono font-bold text-slate-400">{line.accountCode}</td>
                                  <td className="py-2 px-3 font-medium text-slate-200">{line.accountName}</td>
                                  <td className="py-2 px-3 text-right font-mono font-semibold text-emerald-400">{line.debit > 0 ? fmtCurr(line.debit) : '-'}</td>
                                  <td className="py-2 px-3 text-right font-mono font-semibold text-rose-400">{line.credit > 0 ? fmtCurr(line.credit) : '-'}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* MODULE 5: ACCOUNTS RECEIVABLE */}
            {activeTab === 'ar' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-extrabold text-white tracking-tight">Accounts Receivable (AR)</h2>
                    <p className="text-xs text-slate-400 mt-1">Customer balances, outstanding invoices, receivables aging & payment collection</p>
                  </div>
                  <div className="text-right">
                    <div className="text-xs text-slate-400 font-medium">Total Uncollected Receivables</div>
                    <div className="text-xl font-black text-amber-400">{fmtCurr(totals.receivables)}</div>
                  </div>
                </div>

                {/* AR AGING BREAKDOWN CARDS */}
                <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                  <div className="glass-card p-4 rounded-2xl">
                    <div className="text-[10px] font-bold text-slate-400 uppercase">Current (0-30 Days)</div>
                    <div className="text-lg font-black text-emerald-400 mt-1">{fmtCurr(10000.00)}</div>
                  </div>
                  <div className="glass-card p-4 rounded-2xl">
                    <div className="text-[10px] font-bold text-amber-400 uppercase">Overdue (31-60 Days)</div>
                    <div className="text-lg font-black text-amber-400 mt-1">{fmtCurr(18400.00)}</div>
                  </div>
                  <div className="glass-card p-4 rounded-2xl">
                    <div className="text-[10px] font-bold text-rose-400 uppercase">Overdue (61-90 Days)</div>
                    <div className="text-lg font-black text-rose-400 mt-1">{fmtCurr(24000.00)}</div>
                  </div>
                  <div className="glass-card p-4 rounded-2xl">
                    <div className="text-[10px] font-bold text-slate-400 uppercase">Critical (90+ Days)</div>
                    <div className="text-lg font-black text-slate-400 mt-1">{fmtCurr(0.00)}</div>
                  </div>
                </div>

                {/* INVOICES & PAYMENT TRACKING TABLE */}
                <div className="glass-card rounded-2xl p-6 space-y-4">
                  <h3 className="text-sm font-bold text-white">Outstanding Customer Invoices</h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-slate-800 text-slate-400 uppercase tracking-wider font-semibold">
                          <th className="py-3 px-4">Invoice #</th>
                          <th className="py-3 px-4">Customer Name</th>
                          <th className="py-3 px-4">Invoice Date</th>
                          <th className="py-3 px-4">Due Date</th>
                          <th className="py-3 px-4 text-right">Total Amount</th>
                          <th className="py-3 px-4 text-center">Status</th>
                          <th className="py-3 px-4 text-center">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {invoices.map(inv => (
                          <tr key={inv.id} className="hover:bg-slate-800/40 transition">
                            <td className="py-3 px-4 font-mono font-bold text-indigo-400">{inv.id}</td>
                            <td className="py-3 px-4 font-semibold text-white">{inv.customerName}</td>
                            <td className="py-3 px-4 text-slate-300">{inv.date}</td>
                            <td className="py-3 px-4 text-slate-300">{inv.dueDate}</td>
                            <td className="py-3 px-4 text-right font-mono font-bold text-amber-400">{fmtCurr(inv.amount)}</td>
                            <td className="py-3 px-4 text-center">
                              <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                inv.status === 'Paid' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                              }`}>
                                {inv.status}

import { Controller, Get, Post, Body, UseGuards } from '@nestjs/common';
import { JournalsService } from './journals.service';
import { CreateJournalDto } from './dto/create-journal.dto';

@Controller('api/v1/journals')
export class JournalsController {

}`}</pre>

CREATE TABLE chart_of_accounts (
  id VARCHAR(36) PRIMARY KEY,
  code VARCHAR(20) UNIQUE NOT NULL,
  name VARCHAR(150) NOT NULL,
  type VARCHAR(50) NOT NULL, -- Asset, Liability, Equity, Revenue, Expense
  category VARCHAR(100) NOT NULL,
  balance NUMERIC(15, 2) DEFAULT 0.00,
  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
);

CREATE TABLE journal_entries (
  id VARCHAR(36) PRIMARY KEY,
  entry_number VARCHAR(50) UNIQUE NOT NULL,
  entry_date DATE NOT NULL,
  reference VARCHAR(150),
  notes TEXT,
  status VARCHAR(20) DEFAULT 'Posted'
);

CREATE TABLE journal_lines (
  id VARCHAR(36) PRIMARY KEY,
  journal_id VARCHAR(36) REFERENCES journal_entries(id) ON DELETE CASCADE,
  account_id VARCHAR(36) REFERENCES chart_of_accounts(id),
  debit NUMERIC(15, 2) DEFAULT 0.00,
  credit NUMERIC(15, 2) DEFAULT 0.00
);`}</pre>

                    lines: [
                      { accountId: acc1Obj.id, accountCode: acc1Obj.code, accountName: acc1Obj.name, debit: amount, credit: 0 },

                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">Reference / PO #</label>
                      <input type="text" name="reference" placeholder="e.g. PO-9921" required className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Memo Notes</label>
                    <input type="text" name="notes" placeholder="Transaction description" required className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div className="grid grid-cols-2 gap-4 p-4 bg-slate-900/60 rounded-2xl border border-slate-800">
                    <div>
                      <label className="block text-emerald-400 font-bold mb-1">Debit (+) Account</label>
                      <select name="acc1" className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3 py-2">
                        {accounts.map(a => <option key={a.id} value={a.id}>{a.code} - {a.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-rose-400 font-bold mb-1">Credit (-) Account</label>
                      <select name="acc2" defaultValue="2010" className="w-full bg-slate-950 border border-slate-700 text-white rounded-xl px-3 py-2">
                        {accounts.map(a => <option key={a.id} value={a.id}>{a.code} - {a.name}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Total Transaction Amount ({settings.currencySymbol})</label>
                    <input type="number" step="0.01" name="amount" placeholder="0.00" required className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono font-bold" />
                  </div>

                  <div className="flex justify-end space-x-3 pt-3">
                    <button type="button" onClick={() => setModalState({ open: false, type: null, payload: null })} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold shadow-lg">Post Journal Entry</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {modalState.open && modalState.type === 'account' && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="glass-modal w-full max-w-md rounded-3xl p-6 space-y-4 border border-slate-700 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-extrabold text-white">Create New CoA Account</h3>
                  <button onClick={() => setModalState({ open: false, type: null, payload: null })} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleAddAccount({
                    code: fd.get('code'),
                    name: fd.get('name'),
                    type: fd.get('type'),
                    category: fd.get('category'),
                    balance: fd.get('balance'),
                    description: fd.get('description')
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Account 4-Digit Code</label>
                    <input type="text" name="code" placeholder="e.g. 1070" required className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Account Title</label>
                    <input type="text" name="name" placeholder="e.g. Customs Import Tax Expense" required className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">Type</label>
                      <select name="type" className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2">
                        <option value="Asset">Asset</option>
                        <option value="Liability">Liability</option>
                        <option value="Equity">Equity</option>
                        <option value="Revenue">Revenue</option>
                        <option value="Expense">Expense</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">Opening Balance</label>
                      <input type="number" step="0.01" name="balance" defaultValue="0.00" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Category & Description</label>
                    <input type="text" name="description" placeholder="Brief details" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div className="flex justify-end space-x-3 pt-3">
                    <button type="button" onClick={() => setModalState({ open: false, type: null, payload: null })} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold shadow-lg">Create Account</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {modalState.open && modalState.type === 'bill' && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="glass-modal w-full max-w-md rounded-3xl p-6 space-y-4 border border-slate-700 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="text-lg font-extrabold text-white">Record Supplier Bill</h3>
                  <button onClick={() => setModalState({ open: false, type: null, payload: null })} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleCreateBill({
                    supplierId: fd.get('supplierId'),
                    billDate: fd.get('billDate'),
                    dueDate: fd.get('dueDate'),
                    amount: fd.get('amount'),
                    category: fd.get('category')
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Select Vendor / Supplier</label>
                    <select name="supplierId" className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2">
                      {suppliers.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">Bill Date</label>
                      <input type="date" name="billDate" defaultValue={new Date().toISOString().split('T')[0]} required className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-semibold mb-1">Due Date</label>
                      <input type="date" name="dueDate" required className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Bill Total Amount ({settings.currencySymbol})</label>
                    <input type="number" step="0.01" name="amount" placeholder="0.00" required className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono font-bold" />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">Expense Category</label>
                    <input type="text" name="category" defaultValue="Raw Materials Inventory" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div className="flex justify-end space-x-3 pt-3">
                    <button type="button" onClick={() => setModalState({ open: false, type: null, payload: null })} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold shadow-lg">Record Bill</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
